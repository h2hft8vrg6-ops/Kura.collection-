<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html{color-scheme:light} body{margin:0} [hidden]{display:none!important} img{max-width:100%}</style><title>Otaku Vault</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout idea: a card binder. Tab rail on the left (desktop) or tab bar at the bottom (phone); every screen is a stack of panels in one column, like pages in a binder. */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --surface2:#E2E7F1; --ink:#111827; --ink2:#566078; --line:#D5DCEA;
  --accent:#3345E8; --accent-ink:#FFFFFF;
  --r0:#5F6E86; --r1:#2F6FDB; --r2:#0B8576; --r3:#C2238F; --r4:#B7770A; --rb-ink:#FFFFFF;
  --good:#17804A; --bad:#C93636;
  --font-d:'Unbounded',system-ui,sans-serif; --font-b:'Figtree',system-ui,sans-serif; --font-m:'DM Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F1E; --surface:#141A2F; --surface2:#1C2440; --ink:#ECEFFA; --ink2:#9AA6C6; --line:#283153;
    --accent:#8B98FF; --accent-ink:#0B0F1E;
    --r0:#93A1BA; --r1:#6EA8FF; --r2:#2DD4BF; --r3:#F472D0; --r4:#FBBF24; --rb-ink:#0B0F1E;
    --good:#3DD68C; --bad:#FF7A7A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F1E; --surface:#141A2F; --surface2:#1C2440; --ink:#ECEFFA; --ink2:#9AA6C6; --line:#283153;
  --accent:#8B98FF; --accent-ink:#0B0F1E;
  --r0:#93A1BA; --r1:#6EA8FF; --r2:#2DD4BF; --r3:#F472D0; --r4:#FBBF24; --rb-ink:#0B0F1E;
  --good:#3DD68C; --bad:#FF7A7A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font:700 clamp(20px,4.6vw,26px)/1.2 var(--font-d);letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
h2{font:500 14px/1.3 var(--font-d);letter-spacing:.01em;margin:0 0 12px;text-wrap:balance}
p{margin:0 0 10px}
.mut{color:var(--ink2)}
.sm{font-size:12.5px}
.kicker{display:block;font:500 11.5px var(--font-m);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}

/* shell */
.shell{max-width:1180px;margin:0 auto;padding-block:16px}
.content{min-width:0;padding-bottom:96px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:18px}
.hr{display:flex;align-items:center;gap:8px}
.brand{display:inline-flex;align-items:center;gap:9px;font:700 14px var(--font-d);letter-spacing:.06em}
.coins{display:inline-flex;align-items:center;gap:7px;font:500 14px var(--font-m);padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.coins .sm{color:var(--ink2)}
.ib{width:36px;height:36px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:50%;cursor:pointer;color:var(--ink)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-top:1px solid var(--line)}
.nav .brand{display:none}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:0;background:none;color:var(--ink2);font:600 11px var(--font-b);cursor:pointer;border-radius:10px}
.nav button[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:36px;padding-block:24px}
  .nav{position:sticky;top:24px;align-self:start;flex-direction:column;justify-content:flex-start;gap:4px;padding:0;background:none;border:0}
  .nav .brand{display:inline-flex;margin-bottom:22px}
  .head .brand{display:none}
  .head{justify-content:flex-end}
  .nav button{flex:none;flex-direction:row;gap:12px;padding:11px 14px;font-size:14.5px;text-align:left;justify-content:flex-start;border-radius:12px}
  .nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .content{padding-bottom:40px}
}

/* generic parts */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.btn{font:600 14px var(--font-b);padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font:500 13px var(--font-b);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font:500 12px var(--font-m);background:var(--surface2);color:var(--ink2)}
.pill.ok{color:var(--good)}
.empty{padding:28px 8px;text-align:center;color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.acts.c{justify-content:center}
.bar{display:block;width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer;margin-bottom:12px}
.bar .bl{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:5px}
.bar .bl span{font-family:var(--font-m);color:var(--ink2)}
.bt{display:block;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bt i{display:block;height:100%;border-radius:99px}
.hrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.hrow>*{flex:0 0 124px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
.ring{width:132px;height:132px;flex:none}
.ring .rn{font:700 28px var(--font-d);fill:var(--ink)}
.ring .rs{font:500 12px var(--font-m);fill:var(--ink2)}
.prog{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.prog>div:last-child{flex:1;min-width:180px}
.event{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-radius:14px;padding:16px 18px;color:#fff;border:1px solid transparent}
.event p{margin:0}
.event .kicker{color:rgba(255,255,255,.78)}
.event b{font-family:var(--font-d);font-weight:700;font-size:15px}
.event .btn{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.35)}
.note{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}

/* cards */
.cw{container-type:inline-size;width:100%}
.slot{display:block;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer;border-radius:12px}
.card{position:relative;aspect-ratio:5/7;border-radius:5cqw;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);
  border:max(1.5px,.9cqw) solid var(--rc);box-shadow:0 8px 18px -12px rgba(8,12,30,.6);transition:transform .2s}
.slot:hover .card{transform:translateY(-3px)}
.r0{--rc:var(--r0)} .r1{--rc:var(--r1)} .r2{--rc:var(--r2)} .r3{--rc:var(--r3)} .r4{--rc:var(--r4)}
.r4{box-shadow:0 0 0 1px var(--r4),0 8px 22px -8px var(--r4)}
.r5{border-color:transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from 210deg,#f472d0,#fbbf24,#2dd4bf,#7c8bff,#f472d0) border-box}
.art{position:relative;flex:1;min-height:0;background:#0a0d1a;overflow:hidden}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{flex:none;padding:3.2cqw 4.5cqw 4cqw;background:var(--surface)}
.row{display:flex;justify-content:space-between;align-items:center;gap:2cqw;margin-bottom:1.6cqw}
.num{font:400 max(9px,5.6cqw) var(--font-m);color:var(--ink2)}
.rb{font:500 max(9px,5.4cqw) var(--font-m);padding:.5cqw 2.6cqw;border-radius:99px;background:var(--rc);color:var(--rb-ink)}
.r5 .rb{background:linear-gradient(90deg,#d6249f,#e08a00,#0b8576);color:#fff}
.nm{font-weight:700;font-size:max(10px,7.2cqw);line-height:1.18;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{display:none;font-size:5.4cqw;color:var(--ink2);margin-top:1.4cqw}
.big .sub{display:block}
.locked .nm{color:var(--ink2)}
.cnt{position:absolute;top:2.5cqw;right:2.5cqw;background:rgba(10,13,26,.85);color:#fff;font:500 max(10px,6cqw) var(--font-m);padding:.6cqw 2.8cqw;border-radius:99px}
.ht{position:absolute;left:2.5cqw;bottom:2.5cqw;background:rgba(10,13,26,.85);color:#fff;font:500 max(8px,4.6cqw) var(--font-m);letter-spacing:.1em;padding:.6cqw 2.6cqw;border-radius:99px;z-index:2}
.tg{position:absolute;top:2.5cqw;left:2.5cqw;z-index:3;background:var(--accent);color:var(--accent-ink);font:600 max(9px,5cqw) var(--font-b);padding:.8cqw 3cqw;border-radius:99px}
.foil .art::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.4) 44%,rgba(120,255,240,.3) 50%,rgba(255,150,230,.3) 56%,transparent 70%);background-size:260% 260%;mix-blend-mode:screen;animation:sheen 3.8s ease-in-out infinite}
@keyframes sheen{0%{background-position:120% 0}100%{background-position:-60% 0}}
.dupe{display:flex;flex-direction:column;gap:8px}

/* album */
.pgs{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.pg{flex:0 0 auto;min-width:118px;display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.pg b{font-size:13.5px}
.pg span{font:400 12px var(--font-m);color:var(--ink2)}
.pg.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pghead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input[type=search],.filters select,.field{font:500 14px var(--font-b);padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.filters input[type=search]{flex:1 1 200px}
.filters label{display:inline-flex;align-items:center;gap:7px;font-size:14px}

/* packs */
.pk{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pkart{flex:0 0 110px}
.packsvg{width:110px;height:auto;display:block;filter:drop-shadow(0 10px 14px rgba(8,12,30,.35))}
.pkbody{flex:1;min-width:200px}
.odds{font:400 12.5px/1.5 var(--font-m);color:var(--ink2)}

/* trade */
.offer{display:flex;flex-direction:column;gap:14px}
.who{display:flex;gap:12px;align-items:flex-start}
.av{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font:700 14px var(--font-d);flex:none}
.who b{margin-right:8px}
.who span{font:400 12px var(--font-m);color:var(--ink2)}
.who p{margin:2px 0 0;font-size:13.5px;color:var(--ink2)}
.swap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.swap .col{width:108px}
.swap .col.multi{width:auto;display:flex;gap:10px}
.swap .col.multi>div{width:108px}
.arrow{color:var(--ink2)}

/* profile */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{padding:12px 14px;border-radius:12px;background:var(--surface2)}
.stat b{display:block;font:700 20px var(--font-d)}
.stat span{font-size:12.5px;color:var(--ink2)}
.ach{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ach:first-of-type{border-top:0}
.ach .dot{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface2);color:var(--ink2)}
.ach.on .dot{background:var(--good);color:#fff}
.ach div{min-width:0}
.ach b{display:block;font-size:14px}
.ach span{font-size:12.5px;color:var(--ink2)}
.ach.lock{opacity:.7}
textarea.field{width:100%;min-height:88px;font-family:var(--font-m);font-size:12px;resize:vertical}
input.field{width:100%}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(6,9,20,.72);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{position:relative;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:18px;max-width:760px;width:100%;max-height:100%;overflow:auto;padding:22px;display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:640px){.sheet{grid-template-columns:minmax(0,1fr)}.sheet>div:first-child{max-width:230px;margin:0 auto;width:100%}}
.close{position:absolute;top:12px;right:12px;font-size:20px;line-height:1}
.info{display:flex;flex-direction:column;gap:12px;min-width:0;padding-right:30px}
.ttl{font:700 20px/1.25 var(--font-d);margin:0}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font:500 12px var(--font-m);padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--ink)}
.tag.r0{background:var(--r0);color:var(--rb-ink)}.tag.r1{background:var(--r1);color:var(--rb-ink)}.tag.r2{background:var(--r2);color:var(--rb-ink)}.tag.r3{background:var(--r3);color:var(--rb-ink)}.tag.r4{background:var(--r4);color:var(--rb-ink)}.tag.r5{background:linear-gradient(90deg,#d6249f,#e08a00,#0b8576);color:#fff}
.tag.el::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ec);margin-right:6px}
.flav{font-size:15px;margin:0;font-style:italic}
.revbox{width:100%;max-width:880px;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:18px}
.revhint{margin:0;color:#dfe5ff;font-size:14px}
.packstage{width:min(220px,56vw)}
.packstage .packsvg{width:100%}
.packstage.shake{animation:shake .65s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-6deg) scale(1.04)}35%{transform:rotate(6deg) scale(1.06)}55%{transform:rotate(-5deg) scale(1.08)}75%{transform:rotate(4deg) scale(1.1)}}
.rcards{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.rc{position:relative;width:clamp(96px,27vw,156px);perspective:900px;cursor:pointer;--glow:transparent}
.rc.g3{--glow:#f472d0}.rc.g4{--glow:#fbbf24}.rc.g5{--glow:#5ef0ff}
.rc::before{content:"";position:absolute;inset:6%;border-radius:14%;opacity:0;box-shadow:0 0 34px 12px var(--glow);transition:opacity .4s .35s}
.rc.on::before{opacity:.9}
.flip{position:relative;aspect-ratio:5/7;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.25,.5,1)}
.rc.on .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.fr{transform:rotateY(180deg);text-align:left}
.face .cw,.face .card{height:100%}
.face .card{aspect-ratio:auto}
.face.back{border-radius:6%/4.3%;border:2px solid rgba(154,166,255,.45);background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 6px,transparent 6px 12px),linear-gradient(160deg,#1c2350,#0d1230);display:grid;place-items:center}
.ov.jolt{animation:jolt .5s}
@keyframes jolt{0%,100%{transform:translate(0)}20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,5px)}}
.sndbtn{position:fixed;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:5;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.packwrap{position:relative;width:min(220px,56vw);cursor:pointer;--ac:rgba(154,166,255,.45)}
.packwrap::before{content:"";position:absolute;inset:-38%;border-radius:50%;background:radial-gradient(circle,var(--ac),transparent 62%);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}
.rays{position:absolute;inset:-90%;opacity:0;transition:opacity .35s;background:repeating-conic-gradient(rgba(255,255,255,.34) 0 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 60%);mask-image:radial-gradient(circle,#000 0,transparent 60%);animation:spin 7s linear infinite}
.packwrap.open .rays{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.pk2{position:relative;width:100%;aspect-ratio:120/170}
.half{position:absolute;inset:0}
.half .packsvg{width:100%;height:100%}
.half.top{clip-path:inset(0 0 74% 0)}
.half.bot{clip-path:inset(26% 0 0 0)}
.pk2.shake{animation:shake .65s ease-in-out}
.pk2.go .top{animation:tearTop .7s ease-in forwards}
.pk2.go .bot{animation:tearBot .8s .15s ease-in forwards}
@keyframes tearTop{to{transform:translate(70%,-130%) rotate(32deg);opacity:0}}
@keyframes tearBot{to{transform:translateY(30%) scale(.92);opacity:0}}
.rc{animation:deal .6s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--i)*90ms)}
@keyframes deal{from{opacity:0;transform:translateY(70px) scale(.35) rotate(-10deg)}to{opacity:1;transform:none}}
.rc.slow .flip{transition-duration:1.3s}
.rc.g3 .face.back{border-color:#f472d0;box-shadow:0 0 14px #f472d088}
.rc.g4 .face.back{border-color:#fbbf24;box-shadow:0 0 16px #fbbf2499}
.rc.g5 .face.back{border-color:#5ef0ff;box-shadow:0 0 18px #5ef0ffaa}
.sp{position:fixed;z-index:80;width:7px;height:7px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--c);box-shadow:0 0 9px var(--c);pointer-events:none;animation:spark .95s ease-out both}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.banner{position:fixed;left:0;right:0;top:16%;z-index:75;text-align:center;pointer-events:none;font:700 clamp(26px,8vw,54px) var(--font-d);letter-spacing:.08em;color:var(--c);text-shadow:0 0 24px var(--c),0 2px 0 rgba(0,0,0,.5);animation:ban 1.7s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.1)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.flashfx{position:fixed;inset:0;z-index:70;pointer-events:none;background:radial-gradient(circle,var(--fc),transparent 72%);opacity:0;animation:flash .8s ease-out}
@keyframes flash{0%{opacity:0}16%{opacity:.95}100%{opacity:0}}
.toasts{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-left:16px;padding-right:16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:900px){.toasts{bottom:28px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.rays,.packwrap::before{pointer-events:none}

function rollRank(w){const t=w.reduce((a,b)=>a+b,0);let x=Math.random()*t;for(let i=0;i<w.length;i++){x-=w[i];if(x<0)return i}return w.length-1}
function rollCard(rank,pool,ev){
  const arr=pool.filter(c=>c.r===rank),wts=arr.map(c=>c.s===ev?2:1);
  let x=Math.random()*wts.reduce((a,b)=>a+b,0);
  for(let i=0;i<arr.length;i++){x-=wts[i];if(x<0)return arr[i]}
  return arr[arr.length-1];
}
function drawPack(type,sid){
  const P=PACKS[type],pool=type==='ser'?CARDS.filter(c=>c.s===sid&&!c.shop):CARDS.filter(c=>!c.shop),ev=type==='ser'?null:EVENT.id,out=[];
  for(let i=0;i<P.n;i++){
    let w=P.w;if(i===P.n-1&&P.min>0)w=w.map((x,j)=>j<P.min?0:x);
    out.push({c:rollCard(rollRank(w),pool,ev)});
  }
  if(S.pity>=PITY&&!out.some(o=>o.c.r>=4))out[out.length-1]={c:rollCard(rollRank([0,0,0,0,70,30]),pool,ev)};
  out.forEach(o=>{
    o.foil=Math.random()<.08;
    const e=S.col[o.c.id]||(S.col[o.c.id]={n:0,f:0});
    o.isNew=e.n===0;e.n++;if(o.foil)e.f++;
    if(o.c.r>S.best)S.best=o.c.r;
  });
  S.pity=out.some(o=>o.c.r>=4)?0:S.pity+1;
  S.hist=[...out.map(o=>o.c.id),...S.hist].slice(0,24);
  return out;
}

function takeOne(id){const e=S.col[id];if(!e||e.n<1)return null;let foil=false;if(e.n-e.f>0){e.n--}else{e.n--;e.f--;foil=true}if(e.n===0)delete S.col[id];return foil}
function sellOne(id){const e=S.col[id];if(!e||e.n<2)return 0;const f=takeOne(id),v=val(BY[id],f);S.coins+=v;S.pts+=pv(BY[id],f);return v}
function genOffers(){
  const spare={};CARDS.forEach(c=>{const e=S.col[c.id];if(e&&e.n>1)spare[c.id]=e.n-1});
  const missing=CARDS.filter(c=>!owns(c)&&!c.shop),wish=missing.filter(c=>S.wish.includes(c.id));
  const used=new Set(),out=[],npcs=shuffle(NPCS.slice());let tries=0;
  while(out.length<4&&tries<80){
    tries++;
    const pool=(wish.length&&Math.random()<.6)?wish:missing;if(!pool.length)break;
    const g=pick(pool);if(used.has(g.id))continue;
    const same=Object.keys(spare).filter(id=>spare[id]>0&&BY[id].r===g.r);
    let ask=null;
    if(same.length&&(Math.random()<.65||g.r===0)){ask=[pick(same)]}
    else if(g.r>0){
      const slots=[];Object.keys(spare).filter(id=>BY[id].r===g.r-1).forEach(id=>{for(let i=0;i<spare[id];i++)slots.push(id)});
      if(slots.length>=2){shuffle(slots);ask=[slots[0],slots[1]]}
    }
    if(!ask)continue;
    ask.forEach(id=>spare[id]--);used.add(g.id);
    out.push({id:'o'+Date.now().toString(36)+out.length,npc:npcs[out.length%npcs.length],give:g.id,ask});
  }
  return out;
}
function validOffer(o){
  if(owns(BY[o.give]))return false;
  const need={};o.ask.forEach(id=>need[id]=(need[id]||0)+1);
  for(const id in need){const e=S.col[id];if(!e||e.n-1<need[id])return false}
  return true;
}

  const ring=`<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="${own} cartes sur ${tot}"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--surface2)" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C*own/tot).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/><text x="60" y="62" text-anchor="middle" class="rn">${own}</text><text x="60" y="80" text-anchor="middle" class="rs">sur ${tot}</text></svg>`;
  const bars=SERIES.map(s=>{const p=pageProg(PAGEBY['s:'+s.id]);return `<button class="bar" data-a="gopage" data-k="s:${s.id}"><span class="bl"><b>${esc(s.name)}</b><span>${p.own}/${p.total}</span></span><span class="bt"><i style="width:${(p.pct*100).toFixed(0)}%;background:hsl(${s.h} 70% 50%)"></i></span></button>`}).join('');
  const claimed=S.lastDaily===today(),ns=nextStreak();
  const daily=claimed
    ?`<p class="mut">Récompense du jour récupérée. Série en cours : ${S.streak} jour${S.streak>1?'s':''}.</p><p class="mut sm">Reviens demain pour ${dailyVal(S.streak+1)} éclats.</p><button class="btn" disabled>Déjà récupérée</button>`
    :`<p class="mut">Série en cours : ${S.lastDaily===dstr(new Date(Date.now()-864e5))?S.streak:0} jour${S.streak>1?'s':''}. Plus tu reviens, plus la récompense monte, jusqu'au 7e jour.</p><button class="btn pri" data-a="daily">Récupérer ${dailyVal(ns)} éclats</button>`;
  const owned=new Set(CARDS.filter(owns).map(c=>c.id));
  const missing=CARDS.filter(c=>!owned.has(c.id));
  const want=[...S.wish.map(id=>BY[id]).filter(c=>c&&!owned.has(c.id)),...missing.filter(c=>c.s===EVENT.id&&!S.wish.includes(c.id)),...missing.filter(c=>c.s!==EVENT.id&&!S.wish.includes(c.id))].slice(0,6);
  const near=PAGES.map(p=>({p,...pageProg(p)})).filter(x=>!x.done&&x.own>0).sort((a,b)=>b.pct-a.pct).slice(0,3);
  const nearH=near.length?near.map(x=>`<button class="bar" data-a="gopage" data-k="${x.p.key}"><span class="bl"><b>${esc(x.p.name)}</b><span>il manque ${x.total-x.own}</span></span><span class="bt"><i style="width:${(x.pct*100).toFixed(0)}%;background:var(--accent)"></i></span></button>`).join(''):`<p class="mut">Ouvre des boosters pour commencer à remplir tes pages.</p>`;
  return `<div class="stack">
  <div><h1>Ta collection</h1><p class="mut">Chaque carte remplit une série, une catégorie et un élément en même temps.</p></div>
  ${S.starter&&!S.starterSeen?`<div class="panel note"><p style="margin:0">Deux boosters de départ ont déjà été ouverts pour toi. Tu peux voir ces cartes dans l'album.</p><button class="btn sm" data-a="starterok">Compris</button></div>`:''}
  <div class="two">
    <section class="panel"><div class="prog">${ring}<div>${bars}</div></div></section>
    <section class="panel"><span class="kicker">Récompense quotidienne</span><h2>Reviens chaque jour</h2>${daily}</section>
  </div>
  <section class="event" style="background:linear-gradient(120deg,hsl(${EVENT.h} 60% 24%),hsl(${(EVENT.h+40)%360} 65% 38%))"><div><span class="kicker">Collection à l'honneur</span><p><b>${esc(EVENT.name)}</b></p><p class="sm">Les cartes de cette collection sont deux fois plus fréquentes dans les boosters Vault et Prestige jusqu'au ${EVEND}.</p></div><button class="btn" data-a="tab" data-t="packs">Voir les boosters</button></section>
  <section class="panel"><h2>Pages presque complètes</h2>${nearH}</section>
  ${want.length?`<section><h2>À chasser</h2><div class="hrow">${want.map(slot).join('')}</div></section>`:''}
  ${S.hist.length?`<section><h2>Derniers tirages</h2><div class="hrow">${S.hist.slice(0,8).map(id=>slot(BY[id])).join('')}</div></section>`:''}
  </div>`;
}

function oddsText(P){return P.w.map((w,i)=>w?`${RAR[i].name} ${String(w).replace('.',',')} %`:'').filter(Boolean).join(' · ')}
function vPacks(){
  const pity=S.pity>=PITY?'Le prochain booster contient forcément une carte Légendaire ou Alternatif.':`Une carte Légendaire ou Alternatif est garantie au plus tard dans ${PITY+1-S.pity} boosters.`;
  const ser=SER[UI.packSeries];
  const panel=(k,art,extra)=>{const P=PACKS[k];return `<article class="panel pk"><div class="pkart">${art}</div><div class="pkbody"><h2>${P.name}</h2><p class="mut">${P.n} cartes · ${P.desc}</p><p class="odds">Par carte : ${oddsText(P)}</p><p class="odds">Dernière carte : Rare minimum. 8 % de chance d'obtenir une version holo.</p>${extra||''}<div class="acts"><button class="btn pri" data-a="buy" data-pack="${k}"${S.coins<P.cost?' disabled':''}>Ouvrir pour ${P.cost} éclats</button></div></div></article>`};
  const chips=`<div class="chips" style="margin-top:10px">${SERIES.map(s=>`<button class="chip" data-a="pser" data-s="${s.id}" aria-pressed="${UI.packSeries===s.id}">${esc(s.name)}</button>`).join('')}</div>`;
  return `<div class="stack"><div><h1>Boosters</h1><p class="mut">${pity}</p></div>
  ${panel('std',packSVG(235,270,'VAULT'))}
  ${panel('ser',packSVG(ser.h,(ser.h+40)%360,'SÉRIE'),chips)}
  ${panel('pre',packSVG(42,12,'PRESTIGE'))}
  <p class="mut sm">Les cartes de ${esc(EVENT.name)} sont plus fréquentes jusqu'au ${EVEND} dans les boosters Vault et Prestige.</p></div>`;
}

function albumGrid(){
  const p=PAGEBY[UI.page],q=norm(UI.q.trim());
  const list=p.cards.filter(c=>{
    if(UI.miss&&owns(c))return false;
    if(UI.fr>=0&&c.r!==UI.fr)return false;
    if(q&&!norm(`${c.name} ${SER[c.s].name} ${c.t} ${c.e}`).includes(q))return false;
    return true;
  });
  return list.length?`<div class="grid">${list.map(slot).join('')}</div>`:`<p class="empty">Aucune carte ne correspond à ces filtres.</p>`;
}
function vAlbum(){
  const p=PAGEBY[UI.page],pr=pageProg(p),claimed=S.claimed[p.key];
  const gt=GROUPS.map(g=>`<button class="chip" data-a="agroup" data-k="${g.k}" aria-pressed="${UI.group===g.k}">${g.label}</button>`).join('');
  const pg=PAGES.filter(x=>x.g===UI.group).map(x=>{const q=pageProg(x);return `<button class="pg${x.key===UI.page?' on':''}" data-a="gopage" data-k="${x.key}" aria-pressed="${x.key===UI.page}"><b>${esc(x.name)}</b><span>${q.own}/${q.total}</span></button>`}).join('');
  const reward=pr.done&&!claimed?`<button class="btn pri" data-a="claim">Récupérer ${p.reward} éclats</button>`:claimed?`<span class="pill ok">Page validée</span>`:`<span class="pill">Récompense : ${p.reward} éclats</span>`;
  return `<div class="stack"><div><h1>Album</h1><p class="mut">Une même carte apparaît dans trois pages : sa série, sa catégorie et son élément.</p></div>
  <div class="chips">${gt}</div><div class="pgs">${pg}</div>
  <section class="panel"><div class="pghead"><div><span class="kicker">${esc(p.sub)}</span><h2 style="margin:0">${esc(p.name)} · ${pr.own}/${pr.total}</h2></div>${reward}</div>
  <span class="bt" style="margin-bottom:16px"><i style="width:${(pr.pct*100).toFixed(0)}%;background:var(--accent)"></i></span>
  <div class="filters"><input type="search" id="q" placeholder="Nom, série, catégorie, élément" value="${esc(UI.q)}" aria-label="Rechercher une carte"><select id="fr" aria-label="Filtrer par rareté"><option value="-1">Toutes les raretés</option>${RAR.map((r,i)=>`<option value="${i}"${UI.fr===i?' selected':''}>${r.name}</option>`).join('')}</select><label><input type="checkbox" id="miss"${UI.miss?' checked':''}>Manquantes seulement</label></div>
  <div id="agrid">${albumGrid()}</div></section></div>`;
}

function vShop(){
  const items=CARDS.filter(c=>c.shop).sort((a,b)=>a.r-b.r||a.n-b.n);
  const dups=CARDS.reduce((a,c)=>a+(S.col[c.id]&&S.col[c.id].n>1?S.col[c.id].n-1:0),0);
  const got=items.filter(owns).length;
  return `<div class="stack"><div><h1>Boutique</h1><p class="mut">Ces ${items.length} cartes n'existent pas dans les boosters. Recycle tes doublons pour gagner des points, puis échange-les ici. Tu en as ${got}/${items.length}.</p></div>
  <div class="panel"><div class="acts" style="margin:0;align-items:center"><span><b>${S.pts}</b> points</span>${dups?`<button class="btn pri sm" data-a="sellrank" data-r="-1">Recycler tous mes doublons (${dups})</button>`:'<span class="mut">Aucun doublon à recycler pour le moment.</span>'}</div></div>
  <div class="grid">${items.map(c=>{const ok=owns(c),pr=SHOPP[c.r];return `<div class="dupe">${slot(c)}${ok?'<span class="mut" style="text-align:center">Dans ta collection</span>':`<button class="btn sm${S.pts>=pr?' pri':''}" data-a="shopbuy" data-id="${c.id}">Acheter · ${pr} pts</button>`}</div>`}).join('')}</div></div>`;
}
function vTrade(){
  if(!UI.offers)UI.offers=genOffers();
  UI.offers=UI.offers.filter(validOffer);
  const tabs=[['salon',"Salon d'échange"],['dup','Doublons'],['wish','Wishlist']].map(t=>`<button class="chip" data-a="ttab" data-t="${t[0]}" aria-pressed="${UI.tt===t[0]}">${t[1]}</button>`).join('');
  let body='';
  if(UI.tt==='salon'){
    const offs=UI.offers.map(o=>{
      return `<article class="panel offer"><div class="who"><div class="av">${o.npc.n[0]}</div><div><b>${o.npc.n}</b><span>${o.npc.c}</span><p>${esc(o.npc.m)}</p></div></div><div class="swap"><div class="col"><span class="kicker">Tu reçois</span>${slot(BY[o.give])}</div><span class="arrow">${icon('swap')}</span><div><span class="kicker">Tu donnes</span><div class="col multi">${o.ask.map(id=>`<div>${slot(BY[id])}</div>`).join('')}</div></div></div><div class="acts" style="margin-top:0"><button class="btn pri" data-a="accept" data-id="${o.id}">Accepter l'échange</button></div></article>`;
    }).join('');
    const hasDup=CARDS.some(c=>S.col[c.id]&&S.col[c.id].n>1);
    body=`<p class="mut">Des collectionneurs simulés proposent des échanges équitables : même rareté, ou deux doublons d'une rareté inférieure contre une carte supérieure.</p>${offs||`<p class="empty">${hasDup?'Aucune offre pour le moment. Actualise le salon.':'Tu n\'as pas encore de doublons à échanger. Ouvre des boosters.'}</p>`}<div class="acts"><button class="btn" data-a="refresh">Actualiser le salon</button></div>`;
  }else if(UI.tt==='dup'){
    const dups=CARDS.filter(c=>S.col[c.id]&&S.col[c.id].n>1);
    const bulk=[0,1,2,3,4,5].map(r=>{const n=dups.filter(c=>c.r===r).reduce((a,c)=>a+S.col[c.id].n-1,0);return n?`<button class="btn sm" data-a="sellrank" data-r="${r}">Recycler les doublons ${RAR[r].name} (${n})</button>`:''}).join('');
    body=dups.length?`<p class="mut">Chaque carte est gardée en un exemplaire. Les doublons recyclés rapportent des éclats et des points à dépenser dans la Boutique. Les holos rapportent le double.</p><div class="acts" style="margin:0 0 16px">${bulk}</div><div class="grid">${dups.map(c=>{const e=S.col[c.id];return `<div class="dupe">${slot(c)}<button class="btn sm" data-a="sell" data-id="${c.id}">Recycler 1 · +${pv(c,e.n-e.f===0)} pts</button></div>`}).join('')}</div>`:`<p class="empty">Aucun doublon pour le moment.</p>`;
  }else{
    const w=S.wish.map(id=>BY[id]).filter(Boolean);
    body=w.length?`<p class="mut">Les collectionneurs du salon proposent en priorité les cartes de ta wishlist.</p><div class="grid">${w.map(c=>`<div class="dupe">${slot(c)}<button class="btn sm" data-a="wish" data-id="${c.id}">Retirer</button></div>`).join('')}</div>`:`<p class="empty">Ta wishlist est vide. Ouvre une carte dans l'album pour l'ajouter.</p>`;
  }
  return `<div class="stack"><div><h1>Échanges</h1></div><div class="chips">${tabs}</div>${body}</div>`;
}

function vMe(){
  const L=level(),own=ownedN(),copies=Object.values(S.col).reduce((a,e)=>a+e.n,0),holo=Object.values(S.col).filter(e=>e.f>0).length,ur=CARDS.filter(c=>c.r>=4&&owns(c)).length;
  const pct=L.next?Math.min(100,(L.xp-L.t[0])/(L.next[0]-L.t[0])*100):100;
  const stats=[[own+'/'+CARDS.length,'Cartes différentes'],[copies,'Exemplaires'],[holo,'Cartes holo'],[ur,'Légendaires et alt.'],[S.opened,'Boosters ouverts'],[S.trades,'Échanges']].map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('');
  const ach=ACH.map(a=>{const on=!!S.ach[a.id];return `<div class="ach ${on?'on':'lock'}"><span class="dot">${icon(on?'check':'lock',16)}</span><div><b>${a.n}</b><span>${a.d} ${on?'':`Récompense : ${a.r} éclats.`}</span></div></div>`}).join('');
  return `<div class="stack"><div><h1>Profil</h1></div>
  <section class="panel"><span class="kicker">Niveau ${L.i+1}</span><h2>${L.t[1]}</h2><span class="bt" style="margin-bottom:8px"><i style="width:${pct.toFixed(0)}%;background:var(--accent)"></i></span><p class="mut sm">${L.xp} points${L.next?`, encore ${L.next[0]-L.xp} avant « ${L.next[1]} »`:', niveau maximum atteint'}.</p>
  <label class="kicker" for="nm" style="margin-top:14px">Nom de collectionneur</label><input id="nm" class="field" maxlength="28" value="${esc(S.name)}"></section>
  <section class="panel"><h2>Statistiques</h2><div class="stats">${stats}</div></section>
  <section class="panel"><h2>Succès</h2>${ach}</section>
  <section class="panel"><h2>Sauvegarde</h2><p class="mut">${canStore?'Ta collection est enregistrée dans ce navigateur.':'L\'enregistrement automatique n\'est pas disponible ici. Utilise le code de sauvegarde.'} Le code te permet de garder une copie ou de changer d'appareil.</p>
  <textarea id="codebox" class="field" aria-label="Code de sauvegarde" placeholder="Le code de sauvegarde apparaît ici. Colle un code pour le charger.">${esc(UI.code)}</textarea>
  <div class="acts"><button class="btn" data-a="export">Générer mon code</button><button class="btn" data-a="copy">Copier</button><button class="btn" data-a="import">Charger ce code</button></div></section>
  <section class="panel"><h2>Son</h2><div class="chips"><button class="chip" data-a="snd" aria-pressed="${S.sound}">Sons d'ouverture des boosters</button></div></section>
  <section class="panel"><h2>Mentions</h2><p class="mut sm" style="margin:0">Otaku Vault est un projet de fan non officiel. Les noms d'œuvres, de studios et de consoles appartiennent à leurs ayants droit. Les illustrations sont générées par le code et ne reprennent aucune image officielle. Les descriptions sont rédigées librement.</p></section>
  <section class="panel"><h2>Remise à zéro</h2>${UI.confirm?`<p>Toute ta collection sera effacée. Cette action est définitive.</p><div class="acts" style="margin-top:0"><button class="btn pri" data-a="reset">Tout effacer</button><button class="btn" data-a="noreset">Annuler</button></div>`:`<p class="mut">Repars d'une collection vide avec deux boosters de départ.</p><button class="btn" data-a="askreset">Recommencer</button>`}</section></div>`;
}

  const sell=e.n>1?`<button class="btn" data-a="sell" data-id="${c.id}">Recycler un doublon · +${pv(c,e.n-e.f===0)} pts</button>`:'';
  return `<div class="ov" data-a="ovbg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(c.name)}"><div>${cardHTML(c,{big:true})}</div><div class="info"><button class="ib close" data-a="closeov" data-focus aria-label="Fermer">×</button>
  <span class="kicker">N°${pad(c.n)} · ${esc(SER[c.s].name)} ${pad(c.sn,2)}/${PAGEBY['s:'+c.s].cards.length}</span><h2 class="ttl">${esc(c.name)}</h2>
  <div class="tags"><span class="tag r${c.r}">${RAR[c.r].name}</span><span class="tag">${c.t}</span><span class="tag el" style="--ec:${EL[c.e]}">${c.e}</span>${c.g?`<span class="tag">${esc(c.g)}</span>`:''}</div>
  ${c.base?`<p class="mut" style="margin:0">Version alternative de ${esc(BY[c.base].name)}.</p>`:''}<p class="flav">${own?esc(c.txt):'Description verrouillée. Obtiens cette carte pour la lire.'}</p>

function ovReveal(){
  const R=UI.rev,sb=`<button class="ib sndbtn" data-a="snd" aria-label="Activer ou couper le son">${icon(S.sound?'vol':'mute',18)}</button>`;
  if(R.stage==='pack')return `<div class="ov">${sb}<div class="revbox"><div class="packwrap" id="pkw" data-a="revopen"${R.aura?` style="--ac:${R.aura}88"`:''}><div class="rays"></div><div class="pk2" id="pk"><div class="half top">${R.pack}</div><div class="half bot">${R.pack}</div></div></div><p class="revhint">Touche le booster pour l'ouvrir</p><button class="btn pri" data-a="revopen" data-focus>Ouvrir le booster</button></div></div>`;
  return `<div class="ov">${sb}<div class="revbox"><div class="rcards">${R.pulls.map((p,i)=>`<div class="rc g${p.c.r>=3?p.c.r:0}${p.c.r>=4?' slow':''}" data-a="flip" data-i="${i}" data-r="${p.c.r}" style="--i:${i}"><div class="flip"><div class="face back">${BACK}</div><div class="face fr">${cardHTML(p.c,{show:true,foil:p.foil,tag:p.isNew?'Nouveau':'Doublon'})}</div></div></div>`).join('')}</div><ul class="recap">${R.pulls.map((p,i)=>`<li class="rp" data-i="${i}"><span class="tag r${p.c.r}">${RAR[p.c.r].code}</span><span class="rn">${esc(p.c.name)}</span>${p.isNew?'<em>Nouveau</em>':'<small>Doublon</small>'}${p.foil?'<small>Holo</small>':''}</li>`).join('')}</ul><p class="revhint" id="rh">Touche les cartes pour les retourner</p><div class="acts c"><button class="btn" data-a="flipall" data-focus>Tout révéler</button><button class="btn pri" data-a="revdone">Terminer</button></div></div></div>`;
}
function renderOv(){
  const el=$('#ov');
  if(!UI.ov){el.innerHTML='';document.body.style.overflow='';return}
  document.body.style.overflow='hidden';
  el.innerHTML=UI.ov.k==='card'?ovCard(BY[UI.ov.id]):ovReveal();
  const f=el.querySelector('[data-focus]');if(f&&f.focus)f.focus();
}
function revHint(){
  const R=UI.rev,all=document.querySelectorAll?document.querySelectorAll('.rc'):[],on=[...all].filter(x=>x.classList.contains('on')).length;
  const h=$('#rh');if(!h)return;
  if(on>=R.pulls.length){
    const n=R.pulls.filter(p=>p.isNew).length,best=Math.max(...R.pulls.map(p=>p.c.r));
    h.textContent=`${n} nouvelle${n>1?'s':''} carte${n>1?'s':''}. Meilleure rareté : ${RAR[best].name}.`;
  }else h.textContent=`${on} carte${on>1?'s':''} retournée${on>1?'s':''} sur ${R.pulls.length}`;
}

/* ---------- Actions ---------- */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200)}
function applyTheme(){const r=document.documentElement;if(S.theme)r.setAttribute('data-theme',S.theme);else r.removeAttribute('data-theme')}
function isDark(){return S.theme?S.theme==='dark':(typeof matchMedia==='function'&&matchMedia('(prefers-color-scheme: dark)').matches)}
function encode(){const b=new TextEncoder().encode(JSON.stringify(S));let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s)}
function decode(txt){
  const s=atob(txt.trim()),b=Uint8Array.from(s,ch=>ch.charCodeAt(0)),o=JSON.parse(new TextDecoder().decode(b));
  if(!o||o.v!==3||typeof o.col!=='object'||!o.col)throw new Error('format');
  Object.keys(o.col).forEach(k=>{if(!BY[k])delete o.col[k]});
  o.hist=(o.hist||[]).filter(id=>BY[id]);o.wish=(o.wish||[]).filter(id=>BY[id]);
  return Object.assign(fresh(),o);
}
function startReveal(pulls,type,sid){
  const ser=SER[sid]||SER[UI.packSeries];
  const pack=type==='ser'?packSVG(ser.h,(ser.h+40)%360,'SÉRIE'):type==='pre'?packSVG(42,12,'PRESTIGE'):packSVG(235,270,'VAULT');
  const best=Math.max(...pulls.map(p=>p.c.r));
  UI.rev={pulls,pack,stage:'pack',busy:false,aura:{5:'#5ef0ff',4:'#fbbf24',3:'#f472d0',2:'#2dd4bf'}[best]||''};
  UI.ov={k:'rev'};renderOv();
}
function resetAll(){
  S=fresh();S.starter=true;drawPack('std');drawPack('std');S.opened=0;S.pity=0;
  UI.offers=null;UI.confirm=false;UI.code='';applyTheme();save();
}
function closeOv(){UI.ov=null;UI.rev=null;renderOv();render()}

/* Effets d'ouverture : lumière, étincelles, bannière et sons synthétisés */
const FX={3:{c:'#f472d0',n:16,t:'ULTRA RARE'},4:{c:'#fbbf24',n:28,t:'LÉGENDAIRE',flash:1,jolt:1},5:{c:'#5ef0ff',n:38,t:'ALTERNATIF',flash:1,jolt:1}};
let AC=null;
function sfx(kind,r){
  if(!S.sound)return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
    AC=AC||new Ctx();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const tone=(f,t0,d,type,g)=>{const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(.0001,t0);v.gain.exponentialRampToValueAtTime(g,t0+.02);v.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(v);v.connect(AC.destination);o.start(t0);o.stop(t0+d+.05)};
    const noise=(t0,d,g,hp)=>{const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const src=AC.createBufferSource();src.buffer=b;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const v=AC.createGain();v.gain.value=g;src.connect(f);f.connect(v);v.connect(AC.destination);src.start(t0)};
    if(kind==='tear'){noise(t,.5,.4,2200);tone(160,t,.35,'sawtooth',.05)}
    else if(kind==='flip'){noise(t,.16,.2,1800)}
    else{const seq=[[440],[523,659],[523,659,784],[523,659,784,988],[523,659,784,1047,1319],[659,784,988,1319,1568,1976]][r]||[440];seq.forEach((f,i)=>tone(f,t+i*.09,.5,r>=3?'triangle':'sine',.12))}
  }catch(e){}
}
function flashFx(c){const d=document.createElement('div');d.className='flashfx';d.style.setProperty('--fc',c);document.body.appendChild(d);setTimeout(()=>d.remove(),900)}
function banner(t,c){const d=document.createElement('div');d.className='banner';d.textContent=t;d.style.setProperty('--c',c);document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function burst(el,c,n){
  if(!el.getBoundingClientRect)return;
  const b=el.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
  for(let i=0;i<n;i++){
    const d=document.createElement('div'),a=Math.random()*6.283,r=60+Math.random()*130;
    d.className='sp';
    d.style.cssText=`left:${cx}px;top:${cy}px;--c:${c};--dx:${(Math.cos(a)*r).toFixed(0)}px;--dy:${(Math.sin(a)*r).toFixed(0)}px;animation-delay:${(Math.random()*.15).toFixed(2)}s`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),1200);
  }
}
function revFx(el,r){
  setTimeout(()=>{
    sfx('win',r);const fx=FX[r];if(!fx)return;
    burst(el,fx.c,fx.n);banner(fx.t,fx.c);
    if(fx.flash)flashFx(fx.c);
    if(fx.jolt){const o=$('.ov');if(o){o.classList.add('jolt');setTimeout(()=>o.classList.remove('jolt'),600)}}
  },r>=4?750:420);
}

const A={
  tab(t){UI.tab=t.dataset.t;render();window.scrollTo(0,0)},
  theme(){S.theme=isDark()?'light':'dark';applyTheme();save();render()},
  daily(){if(S.lastDaily===today())return;const s=nextStreak(),v=dailyVal(s);S.streak=s;S.lastDaily=today();S.coins+=v;checkAch();save();toast(`+${v} éclats`);render()},
  starterok(){S.starterSeen=true;save();render()},
  card(t){UI.ov={k:'card',id:t.dataset.id};renderOv()},
  closeov(){closeOv()},
  ovbg(){closeOv()},
  gopage(t){const p=PAGEBY[t.dataset.k];UI.group=p.g;UI.page=p.key;UI.q='';UI.fr=-1;UI.miss=false;UI.tab='album';UI.ov=null;renderOv();render();window.scrollTo(0,0)},
  agroup(t){UI.group=t.dataset.k;UI.page=PAGES.find(p=>p.g===UI.group).key;render()},
  claim(){const p=PAGEBY[UI.page];if(!pageProg(p).done||S.claimed[p.key])return;S.claimed[p.key]=1;S.coins+=p.reward;checkAch();save();toast(`Page validée : +${p.reward} éclats`);render()},
  pser(t){UI.packSeries=t.dataset.s;render()},
  buy(t){
    const k=t.dataset.pack,P=PACKS[k];
    if(S.coins<P.cost){toast('Pas assez d\'éclats.');return}
    S.coins-=P.cost;const pulls=drawPack(k,UI.packSeries);S.opened++;UI.offers=null;
    checkAch();save();renderHead();startReveal(pulls,k,UI.packSeries);
  },
  revopen(){
    const R=UI.rev;if(!R||R.stage!=='pack'||R.busy)return;R.busy=true;
    const pk=$('#pk'),w=$('#pkw');if(pk)pk.classList.add('shake');
    setTimeout(()=>{sfx('tear');if(pk)pk.classList.add('go');if(w)w.classList.add('open');flashFx(R.aura||'#ffffff')},650);
    setTimeout(()=>{if(UI.rev===R){R.stage='cards';renderOv()}},1450);
  },
  flip(t){
    if(t.classList.contains('on')||!UI.rev)return;
    t.classList.add('on');const rp=document.querySelector('.rp[data-i="'+t.dataset.i+'"]');if(rp)rp.classList.add('on');sfx('flip');revFx(t,+t.dataset.r);revHint();
  },
  flipall(){
    const all=[...document.querySelectorAll('.rc')].filter(x=>!x.classList.contains('on')).sort((a,b)=>+a.dataset.r-+b.dataset.r);
    let d=0;all.forEach(x=>{setTimeout(()=>A.flip(x),d);d+=+x.dataset.r>=4?1400:420});
  },
  snd(t){S.sound=!S.sound;save();if(UI.ov)t.innerHTML=icon(S.sound?'vol':'mute',18);else render();if(S.sound)sfx('flip')},
  revdone(){closeOv()},
  wish(t){const id=t.dataset.id,i=S.wish.indexOf(id);if(i>=0)S.wish.splice(i,1);else S.wish.push(id);UI.offers=null;save();render();if(UI.ov&&UI.ov.k==='card')renderOv()},
  sell(t){const b=S.pts,v=sellOne(t.dataset.id);if(!v)return;UI.offers=null;save();toast(`+${v} éclats · +${S.pts-b} points`);render();if(UI.ov&&UI.ov.k==='card')renderOv()},
  sellrank(t){const r=+t.dataset.r;const b=S.pts;let tot=0;CARDS.filter(c=>r<0||c.r===r).forEach(c=>{while(S.col[c.id]&&S.col[c.id].n>1)tot+=sellOne(c.id)});if(tot){UI.offers=null;save();toast(`+${tot} éclats · +${S.pts-b} points`);render()}},
  shopbuy(t){const c=BY[t.dataset.id];if(!c||!c.shop||owns(c))return;const pr=SHOPP[c.r];if(S.pts<pr){toast('Pas assez de points.');return}S.pts-=pr;S.col[c.id]={n:1,f:0};checkAch();save();toast(`${c.name} ajoutée à ta collection`);render()},
  imgdel(t){imgDel(t.dataset.id);toast('Image retirée');render();renderOv()},
  ttab(t){UI.tt=t.dataset.t;render()},
  refresh(){UI.offers=genOffers();render()},
  accept(t){
    const o=UI.offers.find(x=>x.id===t.dataset.id);if(!o)return;
    if(!validOffer(o)){toast('Cette offre n\'est plus valable.');render();return}
    o.ask.forEach(takeOne);
    const e=S.col[o.give]||(S.col[o.give]={n:0,f:0});e.n++;
    S.wish=S.wish.filter(x=>x!==o.give);S.trades++;
    UI.offers=UI.offers.filter(x=>x!==o);
    checkAch();save();toast(`Échange conclu avec ${o.npc.n}`);render();
  },
  export(){UI.code=encode();render();const b=$('#codebox');if(b&&b.select)b.select()},
  copy(){
    const b=$('#codebox');if(!b)return;if(!b.value){UI.code=encode();render()}
    const txt=$('#codebox').value;
    try{navigator.clipboard.writeText(txt).then(()=>toast('Code copié')).catch(()=>{$('#codebox').select();toast('Copie le code sélectionné')})}
    catch(e){$('#codebox').select();toast('Copie le code sélectionné')}
  },
  import(){
    const b=$('#codebox');
    try{const o=decode(b.value);S=o;UI.offers=null;UI.code='';applyTheme();save();toast('Sauvegarde chargée');render()}
    catch(e){toast('Ce code n\'est pas valide.')}
  },
  askreset(){UI.confirm=true;render()},
  noreset(){UI.confirm=false;render()},
  reset(){resetAll();toast('Nouvelle collection créée');render()}
};
document.addEventListener('change',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.img&&t.files&&t.files[0])imgFile(t.dataset.img,t.files[0])});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=A[t.dataset.a];if(!a)return;
  if(t.dataset.a==='ovbg'&&e.target!==t)return;
  a(t,e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){UI.q=t.value;$('#agrid').innerHTML=albumGrid()}
  else if(t.id==='nm'){S.name=t.value.trim()||'Collectionneur';save()}
  else if(t.id==='codebox'){UI.code=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fr'){UI.fr=+t.value;$('#agrid').innerHTML=albumGrid()}
  else if(t.id==='miss'){UI.miss=t.checked;$('#agrid').innerHTML=albumGrid()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.ov)closeOv()});

/* ---------- Démarrage ---------- */
if(firstRun){
  drawPack('std');drawPack('std');S.opened=0;S.pity=0;S.starter=true;save();
}
applyTheme();
render();
imgLoad();
</script>
</body></html>
