<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1524" id="themecolor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kizuna">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23c8402f'/%3E%3Ctext x='50' y='66' font-size='70' font-weight='900' text-anchor='middle' fill='%23fbeee6' font-family='serif'%3E絆%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23c8402f'/%3E%3Ctext x='50' y='66' font-size='70' font-weight='900' text-anchor='middle' fill='%23fbeee6' font-family='serif'%3E絆%3C/text%3E%3C/svg%3E">
<title>Kizuna 絆 — le journal des animés, films et mangas</title>
<style>
:root{
  --ai-900:#0b1524;      /* indigo très profond */
  --ai-800:#0f1d31;
  --ai-700:#16294a;
  --ai-600:#1f3a63;
  --ai-500:#37577f;
  --washi:#ece4d4;       /* papier washi */
  --washi-dim:#a9b1bd;
  --hanko:#c8402f;       /* cachet rouge */
  --kinpaku:#dcb15a;     /* feuille d'or */
  --asagi:#6fb3c4;       /* bleu-vert clair */
  --line:rgba(236,228,212,.14);
  --serif:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","Songti SC","Times New Roman",serif;
  --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP","Segoe UI",system-ui,sans-serif;
  --text2:#d6d2c6;--empty:#3a4a63;--wave:rgba(111,179,196,.07);--wave2:rgba(111,179,196,.05);--veil:rgba(5,9,17,.8);--ph1:#1f3a63;--ph2:#0f1d31;
}
:root[data-theme="grandline"]{--ai-900:#06202f;--ai-800:#0a2d42;--ai-700:#0f3d58;--ai-600:#176080;--ai-500:#2f7c9c;--washi:#f3e8cc;--washi-dim:#9fb7bf;--hanko:#d9402e;--kinpaku:#f0c04e;--asagi:#4cc3c9;--line:rgba(243,232,204,.16);--text2:#e4dbc0;--empty:#2b5068;--wave:rgba(76,195,201,.09);--wave2:rgba(76,195,201,.06);--veil:rgba(2,14,22,.82);--ph1:#176080;--ph2:#0a2d42}
:root[data-theme="plusultra"]{--ai-900:#07140f;--ai-800:#0d211a;--ai-700:#143428;--ai-600:#1d5a42;--ai-500:#2f8a65;--washi:#eef3e4;--washi-dim:#a3b8aa;--hanko:#e0352b;--kinpaku:#f5c52b;--asagi:#4fd1a0;--line:rgba(238,243,228,.15);--text2:#d9e2cf;--empty:#2a4538;--wave:rgba(79,209,160,.08);--wave2:rgba(79,209,160,.05);--veil:rgba(2,10,6,.82);--ph1:#1d5a42;--ph2:#0d211a}
:root[data-theme="sakura"]{--ai-900:#f6efe3;--ai-800:#fffaf1;--ai-700:#eadfcd;--ai-600:#e0d2ba;--ai-500:#b9a687;--washi:#231c18;--washi-dim:#6d6258;--hanko:#c0392b;--kinpaku:#c8921f;--asagi:#2f7a8a;--line:rgba(35,28,24,.16);--text2:#3b322c;--empty:#d8cbb6;--wave:rgba(192,57,43,.07);--wave2:rgba(192,57,43,.045);--veil:rgba(35,28,24,.55)}
:root[data-theme="sumi"]{--ai-900:#0a0a0a;--ai-800:#141414;--ai-700:#1d1d1d;--ai-600:#2a2a2a;--ai-500:#4a4a4a;--washi:#efeae0;--washi-dim:#a09a90;--hanko:#d8352a;--kinpaku:#e0b84c;--asagi:#b9b2a3;--line:rgba(239,234,224,.14);--text2:#d4cfc4;--empty:#3a3a3a;--wave:rgba(255,255,255,.035);--wave2:rgba(255,255,255,.025);--veil:rgba(0,0,0,.85);--ph1:#2a2a2a;--ph2:#141414}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ai-900);color:var(--washi);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh;
  background-image:
   radial-gradient(circle at 50% 100%,transparent 0 30%,var(--wave) 31% 33%,transparent 34% 46%,var(--wave2) 47% 49%,transparent 50%),
   linear-gradient(180deg,var(--ai-800),var(--ai-900) 420px);
  background-size:72px 36px,100% 100%;background-repeat:repeat-x,no-repeat;background-position:0 0,0 0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:var(--washi);background:var(--ai-800);border:1px solid var(--line);border-radius:3px;padding:.55em .8em}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--kinpaku);outline-offset:2px}
::placeholder{color:var(--washi-dim)}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0}

/* ───── En-tête ───── */
.topwrap{position:sticky;top:0;z-index:30}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px clamp(14px,4vw,40px);background:var(--ai-900);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}
.hanko{width:46px;height:46px;background:var(--hanko);color:#fbeee6;font-family:var(--serif);font-weight:900;font-size:32px;line-height:1;display:grid;place-items:center;border-radius:5px;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22);letter-spacing:-.04em}
.brand h1{font-size:30px;letter-spacing:.06em;line-height:1}
.brand small{display:block;color:var(--washi-dim);font-size:12.5px;margin-top:4px}
nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%;padding-bottom:2px}
nav button{display:flex;flex-direction:column;align-items:center;padding:8px 14px 9px;border-bottom:3px solid transparent;color:var(--washi-dim);white-space:nowrap;transition:color .15s,border-color .15s}
nav button i{font-style:normal;font-family:var(--serif);font-size:15px;color:var(--asagi);opacity:.85}
nav button span{font-size:13.5px}
nav button:hover{color:var(--washi)}
nav button.on{color:var(--washi);border-color:var(--hanko)}
nav button.on i{color:var(--kinpaku)}

main{padding:22px clamp(14px,4vw,40px) 70px;max-width:1280px;margin:0 auto}

/* ───── Barre d'outils ───── */
.head{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:14px}
.vert{writing-mode:vertical-rl;font-family:var(--serif);font-size:34px;color:var(--hanko);letter-spacing:.12em;line-height:1;height:auto;white-space:nowrap;margin-right:2px}
.head h2{font-size:28px}
.head p{margin:2px 0 0;color:var(--washi-dim);max-width:52ch}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabs button{padding:7px 14px;border:1px solid var(--line);border-radius:999px;color:var(--washi-dim)}
.tabs button.on{background:var(--washi);color:var(--ai-900);border-color:var(--washi);font-weight:600}
.search{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search input[type=search]{flex:1 1 280px;font-size:16px;padding:.75em 1em;border-radius:999px}
.btn{padding:.6em 1.2em;border-radius:999px;background:var(--hanko);color:#fff4ee;font-weight:600;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--washi)}
.btn.ghost:hover{border-color:var(--washi-dim)}
.btn.sm{padding:.35em .9em;font-size:13px}
.sources{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--washi-dim);margin-bottom:16px;min-height:22px}
.sources span{padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.sources .ok{border-color:rgba(111,179,196,.5);color:var(--asagi)}
.sources .ko{border-color:rgba(200,64,47,.55);color:#e89083}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border:1px solid var(--line);border-radius:999px;color:var(--washi-dim);font-size:13.5px}
.chip.on{background:var(--ai-600);color:var(--washi);border-color:var(--ai-500)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters select,.filters input{padding:.4em .7em}

/* ───── Grille d'affiches ───── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:18px 14px}
.card{display:block;text-align:left;width:100%}
.poster{position:relative;aspect-ratio:2/3;border-radius:3px;overflow:hidden;background:linear-gradient(160deg,var(--c,var(--ph1)),var(--ph2));border:1px solid var(--line);transition:transform .18s,border-color .18s}
.card:hover .poster{transform:translateY(-3px);border-color:var(--kinpaku)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.poster .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;font-family:var(--serif);font-size:15px;color:#ece4d4}
.ribbon{position:absolute;z-index:2;left:0;bottom:0;right:0;padding:18px 8px 6px;background:linear-gradient(transparent,rgba(8,14,26,.92));display:flex;justify-content:space-between;align-items:center;font-size:12px}
.ribbon b{color:var(--kinpaku);font-weight:600}
.ribbon .heart{color:var(--hanko);font-size:14px}
.card .t{margin-top:7px;font-family:var(--serif);font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:12.5px;color:var(--washi-dim);display:flex;gap:0;flex-wrap:wrap}
.card .m span+span::before{content:"";display:inline-block;width:1px;height:.9em;background:var(--line);margin:0 7px;vertical-align:-1px}
.card .sc{display:flex;gap:6px;margin-top:2px;font-size:12px;color:var(--asagi)}

/* ───── Étoiles ───── */
.stars{display:inline-flex;font-size:15px;line-height:1;letter-spacing:1px}
.stars.lg{font-size:34px;letter-spacing:3px}
.star{position:relative;background:linear-gradient(90deg,var(--kinpaku) var(--f),var(--empty) var(--f));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.stars.edit .star i{position:absolute;top:0;bottom:0;width:50%;cursor:pointer}
.stars.edit .star i.l{left:0}.stars.edit .star i.r{right:0}

/* ───── Fiche détail ───── */
.veil{position:fixed;inset:0;background:var(--veil);backdrop-filter:blur(3px);z-index:50;overflow-y:auto;padding:4vh 12px}
.sheet{max-width:880px;margin:0 auto;background:var(--ai-800);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
.sheet .ban{height:170px;background:linear-gradient(160deg,var(--c,var(--ai-600)),var(--ai-700));background-size:cover;background-position:center 30%;position:relative}
.sheet .ban::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,var(--ai-800))}
.x{position:absolute;top:10px;right:12px;z-index:3;width:36px;height:36px;border-radius:50%;background:rgba(8,14,26,.75);color:#fff;font-size:20px;line-height:1}
.body{display:grid;grid-template-columns:200px 1fr;gap:26px;padding:0 26px 26px;margin-top:-90px;position:relative;z-index:2}
.body .poster{border-radius:4px}
.body h2{font-size:27px;line-height:1.2}
.body .jp{color:var(--washi-dim);font-family:var(--serif);margin:2px 0 8px}
.facts{display:flex;flex-wrap:wrap;margin:6px 0 10px;color:var(--washi-dim);font-size:13.5px}
.facts span+span::before{content:"";display:inline-block;width:1px;height:.9em;background:var(--line);margin:0 9px;vertical-align:-1px}
.genres{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.genres span{font-size:12.5px;border:1px solid var(--line);padding:2px 10px;border-radius:999px;color:var(--asagi)}
.syn{white-space:pre-line;color:var(--text2);max-height:9.5em;overflow:auto;padding-right:6px}
.langs{display:flex;gap:6px;margin:0 0 6px}
.panel{grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:16px}
.panel .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.panel label{color:var(--washi-dim);font-size:13.5px;min-width:76px}
.panel textarea{width:100%;min-height:96px;resize:vertical}
.heartbtn{font-size:30px;color:var(--empty);transition:color .15s,transform .15s}
.heartbtn.on{color:var(--hanko);transform:scale(1.08)}
.prog{display:flex;align-items:center;gap:8px}
.prog input{width:84px;text-align:center}
.prog .btn{padding:.3em .8em}
.listrow{display:flex;gap:6px;flex-wrap:wrap}

/* ───── Journal ───── */
.month{font-family:var(--serif);font-size:20px;margin:26px 0 6px;color:var(--kinpaku);text-transform:capitalize}
.entry{display:grid;grid-template-columns:54px 56px 1fr auto;gap:14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.entry .d{font-family:var(--serif);font-size:30px;line-height:1;text-align:center;color:var(--washi-dim)}
.entry .poster{width:56px}
.entry h3{font-size:17px}
.entry p{margin:4px 0 0;color:var(--text2);max-width:70ch;white-space:pre-line}
.entry .tag{font-size:12.5px;color:var(--asagi);margin-left:8px}

/* ───── Listes ───── */
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.lcard{text-align:left;border:1px solid var(--line);border-radius:4px;padding:12px;background:var(--ai-800);transition:border-color .15s}
.lcard:hover{border-color:var(--kinpaku)}
.mosaic{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;aspect-ratio:8/3;margin-bottom:10px}
.mosaic div{background:var(--ai-700);background-size:cover;background-position:center;border-radius:2px}
.lcard h3{font-size:17px}
.lcard small{color:var(--washi-dim)}

/* ───── Profil ───── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.stat{border:1px solid var(--line);border-radius:4px;padding:14px 16px;background:var(--ai-800)}
.stat b{display:block;font-family:var(--serif);font-size:32px;line-height:1.1}
.stat span{color:var(--washi-dim);font-size:13px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px;margin-bottom:26px}
.sec h3{font-size:19px;margin-bottom:12px}
.histo{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:8px}
.histo div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11.5px;color:var(--washi-dim);gap:4px}
.histo i{display:block;width:100%;background:var(--kinpaku);border-radius:2px 2px 0 0;min-height:2px}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:120px 1fr 28px;gap:10px;align-items:center;font-size:13.5px}
.bar i{display:block;height:9px;background:var(--asagi);border-radius:2px}
.setrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.setrow input[type=text],.setrow input[type=password]{flex:1 1 280px}
.note{color:var(--washi-dim);font-size:13px;max-width:70ch}

.empty{border:1px dashed var(--line);border-radius:6px;padding:40px 20px;text-align:center;color:var(--washi-dim)}
.empty .vert{margin:0 auto 10px;color:var(--washi-dim);opacity:.5}
.empty p{margin:6px auto 14px;max-width:48ch}
.more{display:block;margin:26px auto 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--washi);color:var(--ai-900);padding:9px 18px;border-radius:999px;z-index:80;font-weight:600}
footer{text-align:center;color:var(--washi-dim);font-size:12.5px;padding:0 14px 30px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--kinpaku);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.theme{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--ai-800);min-width:132px;text-align:left}
.theme.on{border-color:var(--kinpaku);box-shadow:0 0 0 1px var(--kinpaku)}
.theme .sw{display:flex;padding-left:8px}
.theme .sw i{width:26px;height:26px;border-radius:50%;margin-left:-8px;border:2px solid var(--ai-800)}
.theme span{font-size:13.5px}
.wk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.wk .label{font-family:var(--serif);font-size:18px;margin:0 6px}
.day{margin-top:22px}
.day h3{font-size:19px;text-transform:capitalize;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:6px}
.day h3 em{font-style:normal;font-size:12.5px;background:var(--hanko);color:#fff;padding:1px 10px;border-radius:999px;font-family:var(--sans);text-transform:none}
.air{display:grid;grid-template-columns:52px 46px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.air .tm{font-family:var(--serif);font-size:17px;color:var(--kinpaku)}
.air .poster{width:46px}
.air h4{margin:0;font-family:var(--serif);font-size:16px;line-height:1.25}
.air small{color:var(--washi-dim)}
.air .st{font-size:12.5px;border:1px solid var(--kinpaku);color:var(--kinpaku);padding:1px 10px;border-radius:999px;white-space:nowrap}
.sheet.t10{padding:22px;max-width:640px}
.sheet.t10 h2{font-size:24px;padding-right:44px}
.t10cv{width:100%;max-width:560px;display:block;margin:16px auto;border-radius:4px;border:1px solid var(--line);background:var(--ai-900)}
.t10list{display:grid;gap:6px}
.t10row{display:grid;grid-template-columns:26px 1fr auto auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.t10row>b{font-family:var(--serif);font-size:20px;color:var(--kinpaku);text-align:center}
.t10row .tt{font-family:var(--serif);font-size:15px;line-height:1.25}
.row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hanko{border:0;padding:0;cursor:pointer;transition:transform .15s}
.hanko:hover{transform:rotate(0deg) scale(1.06)}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-family:var(--serif);font-weight:700;flex:none;border:2px solid var(--line)}
.pm-back{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.28)}
.pmenu{position:absolute;top:78px;left:clamp(10px,3vw,36px);width:min(340px,calc(100vw - 20px));background:var(--ai-800);border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.pm-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pm-head b{font-family:var(--serif);font-size:18px;display:block}
.pm-head small{color:var(--washi-dim)}
.pm-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;text-align:center}
.pm-stats div{background:var(--ai-700);border-radius:4px;padding:6px 2px}
.pm-stats b{display:block;font-family:var(--serif);font-size:20px;line-height:1.2}
.pm-stats span{font-size:11.5px;color:var(--washi-dim)}
.pm-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 8px;border-top:1px solid var(--line)}
.pm-item:hover{background:var(--ai-700)}
.pm-item i{font-style:normal;font-family:var(--serif);color:var(--hanko);width:24px;text-align:center;font-size:16px}
.pcard{display:flex;gap:18px;align-items:flex-start;margin-bottom:22px;padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--ai-800);flex-wrap:wrap}
.pinfo{flex:1 1 260px;display:grid;gap:10px;min-width:0}
.pname{font-family:var(--serif);font-size:24px;font-weight:700;background:transparent;border-color:transparent;padding:.2em .3em;width:100%}
.pname:hover,.pname:focus{border-color:var(--line)}
.pbio{width:100%;min-height:64px;resize:vertical}
.avs{display:flex;gap:6px;flex-wrap:wrap}
.avs .chip{font-family:var(--serif);font-size:17px;padding:3px 11px}
.colr{width:28px;height:28px;border-radius:50%;border:2px solid var(--line)}
.colr.on{border-color:var(--washi)}
.grid.fav{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));margin-bottom:12px}
.sh{border:1px solid var(--line);border-radius:6px;background:var(--ai-800);margin-bottom:12px;overflow:hidden}

<body>
<div id="app"></div>
<footer><div id="legal-links" class="flinks"></div>Kizuna · version <span id="ver"></span> · Données fournies par AniList, MyAnimeList (via Jikan) et TMDB. Ta collection reste enregistrée sur cet appareil.</footer>

<script>
'use strict';
/* ═════════ Identité (change le nom ici) ═════════ */
const APP = { version:'12', name:'Kizuna', kanji:'絆', tag:'Le journal de tes animés, films et mangas' };

/* ═════════ Stockage local ═════════ */
const KEY = 'kizuna.v1';
let mem = null;
const defaults = () => ({ items:{}, diary:[], lists:[], shelf:{}, profile:{ name:'', bio:'', avatar:'絆', color:'#c8402f', favs:[] }, settings:{ tmdb:'', jikan:true, theme:'indigo' } });
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const d = JSON.parse(r); return Object.assign(defaults(), d, { settings:Object.assign(defaults().settings, d.settings||{}), profile:Object.assign(defaults().profile, d.profile||{}) }); } }catch(e){}
  return mem || defaults();
}
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ mem = DB; } }
function save(){ DB.updatedAt = Date.now(); saveLocal(); try{ scheduleSync(); }catch(e){} }
let DB = load();
function applyTheme(){
  document.documentElement.setAttribute('data-theme', DB.settings.theme || 'indigo');
  const m = document.getElementById('themecolor');
  if(m) m.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--ai-900').trim() || '#0b1524');
}
applyTheme();

/* ═════════ Utilitaires ═════════ */
function h(tag, a, ...kids){
  const e = document.createElement(tag);
  let val;
  if(a) for(const k in a){
    const v = a[k];
    if(v==null || v===false) continue;
    if(k==='class') e.className = v;
    else if(k==='style') e.style.cssText = v;
    else if(k==='value') val = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v===true ? '' : v);
  }
  for(const c of kids.flat(3)){ if(c==null || c===false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  if(val!==undefined) e.value = val;
  return e;
}
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const today = () => new Date().toISOString().slice(0,10);
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\u3040-\u30ff\u4e00-\u9faf]/g,'');
function toast(msg){ const t = h('div',{class:'toast'},msg); document.body.append(t); setTimeout(()=>t.remove(),2200); }
const fmtDate = d => { try{ return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return d; } };

const TYPE = {
  anime:{ label:'Animés', kanji:'アニメ', desc:'Séries, OAV et ONA' },
  film:{ label:'Films', kanji:'映画', desc:'Longs métrages d’animation' },
  manga:{ label:'Mangas', kanji:'漫画', desc:'Ton étagère de lectures' }
};
const STATUS = t => t==='manga'
  ? [['planned','À lire'],['current','En cours'],['done','Lu'],['dropped','Abandonné']]
  : [['planned','À voir'],['current','En cours'],['done','Vu'],['dropped','Abandonné']];
const statusLabel = (t,s) => (STATUS(t).find(x=>x[0]===s)||[])[1] || '';
const FORMAT_FR = { TV:'Série TV', TV_SHORT:'Série courte', MOVIE:'Film', SPECIAL:'Spécial', OVA:'OAV', ONA:'ONA', MUSIC:'Clip', MANGA:'Manga', ONE_SHOT:'One-shot', NOVEL:'Roman' };
const STATE_FR = { FINISHED:'Terminé', RELEASING:'En cours de diffusion', NOT_YET_RELEASED:'À venir', CANCELLED:'Annulé', HIATUS:'En pause' };

/* ═════════ Entrées de collection ═════════ */
const E = k => DB.items[k];
function ensure(meta){
  if(!DB.items[meta.key]) DB.items[meta.key] = { meta, status:null, rating:0, liked:false, review:'', progress:0, tags:[], seen:'', added:Date.now(), upd:Date.now() };
  else if(meta.cover || meta.synopsis) DB.items[meta.key].meta = Object.assign({}, DB.items[meta.key].meta, meta);
  return DB.items[meta.key];
}
const active = e => !!(e && (e.status || e.rating || e.liked || e.review));
function prune(key){
  const e = DB.items[key];
  if(e && !active(e) && !DB.lists.some(l=>l.keys.includes(key)) && !DB.diary.some(d=>d.key===key)) delete DB.items[key];
}
function touch(e){ e.upd = Date.now(); save(); }
const metaOf = key => (DB.items[key]||{}).meta;

/* ═════════ Sources de données ═════════ */
const stripHtml = d => (d||'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').trim();

const AL_FIELDS = 'id idMal type format status episodes chapters volumes seasonYear startDate{year} averageScore genres description(asHtml:false) bannerImage coverImage{extraLarge large color} title{romaji english native} studios(isMain:true){nodes{name}}';
function alNorm(m){
  return {
    key:'al:'+m.id, malId:m.idMal||null,
    type: m.type==='MANGA' ? 'manga' : (m.format==='MOVIE' ? 'film' : 'anime'),
    title: m.title.english || m.title.romaji, titleRo:m.title.romaji, titleJp:m.title.native||'',
    cover: m.coverImage.extraLarge || m.coverImage.large || '', banner:m.bannerImage||'', color:m.coverImage.color||'',
    year: m.seasonYear || (m.startDate&&m.startDate.year) || null,
    format: FORMAT_FR[m.format]||m.format||'', state: STATE_FR[m.status]||'',
    episodes:m.episodes||null, chapters:m.chapters||null, volumes:m.volumes||null,
    genres:m.genres||[], synopsis:stripHtml(m.description),
    studios:((m.studios&&m.studios.nodes)||[]).map(x=>x.name),
    scoreAL:m.averageScore||null, src:['AniList']
  };
}
async function alPost(query, variables){
  const r = await fetch('https://graphql.anilist.co',{ method:'POST', headers:{'Content-Type':'application/json',Accept:'application/json'}, body:JSON.stringify({ query, variables }) });
  if(!r.ok) throw new Error('AniList '+r.status);
  const j = await r.json();
  if(j.errors) throw new Error(j.errors[0].message);
  return j.data;
}
const GENRES = [['Action','Action'],['Adventure','Aventure'],['Comedy','Comédie'],['Drama','Drame'],['Fantasy','Fantasy'],['Horror','Horreur'],['Mahou Shoujo','Magical girl'],['Mecha','Mecha'],['Music','Musique'],['Mystery','Mystère'],['Psychological','Psychologique'],['Romance','Romance'],['Sci-Fi','Science-fiction'],['Slice of Life','Tranche de vie'],['Sports','Sport'],['Supernatural','Surnaturel'],['Thriller','Thriller']];
const genreArg = () => S.genre ? ` genre_in:["${S.genre}"]` : '';
const yearArg = () => S.year ? ` startDate_greater:${S.year-1}1231 startDate_lesser:${S.year+1}0101` : '';
function letterOf(t){ if(!t) return ''; const x = t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/[A-Za-z0-9]/); if(!x) return '#'; return /\d/.test(x[0]) ? '#' : x[0].toUpperCase(); }
const matchLetter = (m,L) => letterOf(m.title)===L || letterOf(m.titleRo)===L;
function visibleResults(){
  let l = S.results;
  if(S.letter) l = l.filter(m=>matchLetter(m,S.letter));
  if(S.sort==='ALPHA' && !S.q.trim() && S.sub==='explore') l = l.slice().sort((a,b)=>a.title.localeCompare(b.title,'fr',{sensitivity:'base'}));
  return l;
}
async function anilist(scope, q, page, custom, perPage){
  let args, decl, vars;
  if(custom){ args = custom + genreArg(); decl = '$p:Int'; vars = { p:page }; }
  else {
    const fmt = scope==='film' ? 'format:MOVIE' : scope==='anime' ? 'format_not_in:[MOVIE]' : 'format_in:[MANGA,ONE_SHOT]';
    const type = scope==='manga' ? 'MANGA' : 'ANIME';
    decl = q ? '$s:String,$p:Int' : '$p:Int';
    const sortArg = S.sort==='SCORE_DESC' ? 'sort:SCORE_DESC popularity_greater:10000' : 'sort:'+(S.sort==='ALPHA' ? 'POPULARITY_DESC' : S.sort);
    args = `type:${type} ${fmt} isAdult:false ${q ? 'search:$s sort:SEARCH_MATCH' : sortArg}${genreArg()}${yearArg()}`;
    vars = q ? { s:q, p:page } : { p:page };
  }
  const data = await alPost(`query(${decl}){Page(page:$p,perPage:${perPage||24}){pageInfo{hasNextPage} media(${args}){${AL_FIELDS}}}}`, vars);
  return { more:data.Page.pageInfo.hasNextPage, list:data.Page.media.map(alNorm) };
}
async function anilistBatch(scope, startPage, custom){
  const pages = Array.from({length:6},(_,i)=>startPage+i);
  const rs = await Promise.allSettled(pages.map(pg=>anilist(scope,'',pg,custom,50)));
  const seen = new Set(), list = []; let more = false, ok = false;
  rs.forEach(r=>{ if(r.status==='fulfilled'){ ok = true; r.value.list.forEach(m=>{ if(!seen.has(m.key)){ seen.add(m.key); list.push(m); } }); more = r.value.more; } });
  if(!ok) throw new Error('AniList');
  return { list, more, next:startPage+6 };
}
async function anilistWeek(from, to){
  const out = [];
  for(let page=1; page<=10; page++){
    const data = await alPost(`query($f:Int,$t:Int,$p:Int){Page(page:$p,perPage:50){pageInfo{hasNextPage} airingSchedules(airingAt_greater:$f,airingAt_lesser:$t,sort:TIME){airingAt episode media{${AL_FIELDS} popularity isAdult}}}}`, { f:from, t:to, p:page });
    const P = data.Page;
    P.airingSchedules.forEach(a=>{ if(a.media && !a.media.isAdult) out.push({ at:a.airingAt, ep:a.episode, pop:a.media.popularity||0, meta:alNorm(a.media) }); });
    if(!P.pageInfo.hasNextPage) break;
  }
  return out;
}

async function jikan(scope, q){
  const ep = scope==='manga' ? 'manga' : 'anime';
  const extra = scope==='film' ? '&type=movie' : '';
  const r = await fetch(`https://api.jikan.moe/v4/${ep}?q=${encodeURIComponent(q)}&limit=15&sfw=true${extra}`);
  if(!r.ok) throw new Error('Jikan '+r.status);
  const j = await r.json();
  return (j.data||[]).filter(x=>scope!=='anime' || x.type!=='Movie').map(x=>({
    key:`mal:${ep}:${x.mal_id}`, malId:x.mal_id,
    type: scope==='manga' ? 'manga' : (x.type==='Movie' ? 'film' : 'anime'),
    title:x.title_english || x.title, titleRo:x.title, titleJp:x.title_japanese||'',
    cover:(x.images&&x.images.jpg&&(x.images.jpg.large_image_url||x.images.jpg.image_url))||'', banner:'', color:'',
    year:x.year || (x.aired&&x.aired.prop&&x.aired.prop.from&&x.aired.prop.from.year) || (x.published&&x.published.prop&&x.published.prop.from&&x.published.prop.from.year) || null,
    format:x.type||'', state:'', episodes:x.episodes||null, chapters:x.chapters||null, volumes:x.volumes||null,
    genres:(x.genres||[]).map(g=>g.name), synopsis:(x.synopsis||'').trim(),
    studios:(x.studios||[]).map(s=>s.name), scoreMAL:x.score||null, src:['MyAnimeList']
  }));
}

async function tmdb(scope, q){
  const kind = scope==='film' ? 'movie' : 'tv';
  const k = DB.settings.tmdb.trim();
  const bearer = k.startsWith('eyJ');
  const url = `https://api.themoviedb.org/3/search/${kind}?language=fr-FR&include_adult=false&query=${encodeURIComponent(q)}${bearer ? '' : '&api_key='+encodeURIComponent(k)}`;
  const r = await fetch(url, bearer ? { headers:{ Authorization:'Bearer '+k } } : undefined);
  if(!r.ok) throw new Error('TMDB '+r.status);
  const j = await r.json();
  return (j.results||[]).filter(x=>(x.genre_ids||[]).includes(16)).map(x=>({
    key:`tmdb:${kind}:${x.id}`, type:scope,
    title:x.title||x.name, titleRo:'', titleJp:x.original_title||x.original_name||'',
    cover:x.poster_path ? 'https://image.tmdb.org/t/p/w500'+x.poster_path : '',
    banner:x.backdrop_path ? 'https://image.tmdb.org/t/p/w780'+x.backdrop_path : '', color:'',
    year:parseInt((x.release_date||x.first_air_date||'').slice(0,4),10)||null,
    format: scope==='film' ? 'Film' : 'Série', state:'', episodes:null, chapters:null, volumes:null,
    genres:[], synopsis:x.overview||'', studios:[], scoreTMDB:x.vote_average ? Math.round(x.vote_average*10)/10 : null, src:['TMDB']
  }));
}

/* Croisement : on fusionne les résultats des différents sites */
function mergeSources(base, jk, tm){
  const out = base.slice();
  (jk||[]).forEach(j=>{
    const a = out.find(m=>m.malId && m.malId===j.malId);
    if(a){ a.scoreMAL = j.scoreMAL; if(!a.src.includes('MyAnimeList')) a.src.push('MyAnimeList'); if(!a.synopsis) a.synopsis = j.synopsis; }
    else out.push(j);
  });
  (tm||[]).forEach(t=>{
    const keys = [norm(t.title), norm(t.titleJp)].filter(Boolean);
    const a = out.find(m=>[m.title,m.titleRo,m.titleJp].some(n=>keys.includes(norm(n))));
    if(a){ a.fr = { title:t.title, synopsis:t.synopsis }; a.scoreTMDB = t.scoreTMDB; if(!a.src.includes('TMDB')) a.src.push('TMDB'); if(!a.cover) a.cover = t.cover; if(!a.banner) a.banner = t.banner; }
    else out.push(t);
  });
  return out;
}

/* ═════════ État de l'interface ═════════ */
const S = { view:'profile', sub:'explore', q:'', results:[], page:1, more:false, loading:false, src:{}, token:0,
            filter:{ status:'all', sort:'recent', text:'' }, openList:null,
            season:curSeason(), sort:'POPULARITY_DESC', letter:'', genre:'', year:0, shelf:{ q:'', res:[], loading:false, err:false, open:{}, tok:0, dt:null }, cal:{ off:0, data:{}, loading:false, err:false, pop:true, mine:false } };
const SEASONS = ['WINTER','SPRING','SUMMER','FALL'];
const SEASON_FR = { WINTER:'Hiver', SPRING:'Printemps', SUMMER:'Été', FALL:'Automne' };
function curSeason(){ const d = new Date(); return { s:['WINTER','SPRING','SUMMER','FALL'][Math.floor(d.getMonth()/3)], y:d.getFullYear() }; }
function shiftSeason(n){ const i = S.season.y*4 + SEASONS.indexOf(S.season.s) + n; S.season = { y:Math.floor(i/4), s:SEASONS[((i%4)+4)%4] }; }
const seasonArgs = () => `type:ANIME season:${S.season.s} seasonYear:${S.season.y} format_not_in:[MOVIE] isAdult:false sort:POPULARITY_DESC`;
let debounce;

async function runSearch(append){
  const scope = S.view, q = S.sub==='season' ? '' : S.q.trim(), my = ++S.token;
  S.loading = true;
  if(!append){ S.page = 1; S.results = []; S.src = {}; }
  renderContent();
  const batch = !q && (S.letter || (S.sub==='explore' && S.sort==='ALPHA'));
  const first = batch ? anilistBatch(scope,S.page,S.sub==='season' ? seasonArgs() : null)
                      : (S.sub==='season' ? anilist('anime','',S.page,seasonArgs()) : anilist(scope,q,S.page));
  const tasks = [['AniList', first]];
  if(!append){
    if(DB.settings.jikan && q) tasks.push(['MyAnimeList', jikan(scope,q)]);
    if(DB.settings.tmdb && q && scope!=='manga') tasks.push(['TMDB', tmdb(scope,q)]);
  }
  const res = await Promise.allSettled(tasks.map(t=>t[1]));
  if(my !== S.token) return;
  const state = {};
  let al = null, jk = null, tm = null;
  res.forEach((r,i)=>{
    const name = tasks[i][0];
    state[name] = r.status==='fulfilled' ? 'ok' : 'ko';
    if(r.status==='fulfilled'){ if(name==='AniList') al = r.value; if(name==='MyAnimeList') jk = r.value; if(name==='TMDB') tm = r.value; }
  });
  S.loading = false;
  if(append){
    if(al){ const have = new Set(S.results.map(m=>m.key)); S.results = S.results.concat(al.list.filter(m=>!have.has(m.key))); S.more = al.more; S.page = al.next || S.page+1; }
  } else {
    S.src = state;
    S.results = al ? mergeSources(al.list, jk, tm) : mergeSources([], jk, tm);
    S.more = al ? al.more : false; S.page = (al && al.next) || 2;
  }
  renderContent();
}

function go(view, sub){
  S.view = view; S.sub = sub || 'explore'; S.q = ''; S.results = []; S.src = {}; S.more = false; S.openList = null; S.letter = ''; S.genre = ''; S.year = 0;
  S.filter = { status:'all', sort:'recent', text:'' };
  render();
  if(TYPE[view] && S.sub!=='mine') runSearch(false); else if(view==='calendar') loadCalendar();
}

/* ═════════ Composants ═════════ */
function Stars(val, onSet, big){
  const w = h('span',{class:'stars'+(onSet?' edit':'')+(big?' lg':''), role:onSet?'group':'img', 'aria-label':'Note : '+val+' sur 5'});
  for(let i=1;i<=5;i++){
    const f = Math.max(0, Math.min(1, val-(i-1)));
    const s = h('span',{class:'star'},'★');
    s.style.setProperty('--f', (f*100)+'%');
    if(onSet){
      s.append(h('i',{class:'l',onclick:()=>onSet(val===i-.5 ? 0 : i-.5)}), h('i',{class:'r',onclick:()=>onSet(val===i ? 0 : i)}));
    }
    w.append(s);
  }
  return w;
}

function Poster(meta){
  return h('div',{class:'poster',style:meta.color?`--c:${meta.color}`:''},
    h('span',{class:'ph'},meta.title),
    meta.cover ? h('img',{src:meta.cover,loading:'lazy',alt:'',referrerpolicy:'no-referrer',onerror:ev=>ev.target.remove()}) : null);
}

function Card(meta){
  const e = E(meta.key);
  const rib = (e && (e.status || e.liked)) ? h('div',{class:'ribbon'},
      h('b',{},e.status ? statusLabel(meta.type,e.status) : ''), e.liked ? h('span',{class:'heart'},'♥') : null) : null;
  const p = Poster(meta); if(rib) p.append(rib);
  const scores = [];
  if(meta.scoreAL) scores.push(h('span',{},'AniList '+(meta.scoreAL/10).toFixed(1)));
  if(meta.scoreMAL) scores.push(h('span',{},'MAL '+meta.scoreMAL));
  return h('button',{class:'card',onclick:()=>openDetail(meta)}, p,
    h('div',{class:'t'},meta.title),
    h('div',{class:'m'}, meta.year?h('span',{},String(meta.year)):null, meta.format?h('span',{},meta.format):null),
    e && e.rating ? Stars(e.rating) : (scores.length ? h('div',{class:'sc'},scores) : null));
}

function Empty(kanji, title, text, action){
  return h('div',{class:'empty'}, h('div',{class:'vert'},kanji), h('h3',{},title), h('p',{},text), action||null);
}

/* ═════════ Fiche détaillée ═════════ */
let CUR = null;
function openDetail(meta){
  CUR = { meta, lang:'fr' };
  renderDetail();
  document.body.style.overflow = 'hidden';
}
function closeDetail(){
  if(!CUR) return;
  prune(CUR.meta.key); save();
  CUR = null; $('#veil') && $('#veil').remove();
  document.body.style.overflow = '';
  renderContent();
}
function renderDetail(){
  const meta = CUR.meta, e = E(meta.key) || { status:null, rating:0, liked:false, review:'', progress:0, tags:[], seen:'' };
  const isManga = meta.type==='manga', isFilm = meta.type==='film';
  const max = isManga ? meta.chapters : (isFilm ? null : meta.episodes);
  const unit = isManga ? 'chapitres' : 'épisodes';
  const syn = (CUR.lang==='fr' && meta.fr && meta.fr.synopsis) ? meta.fr.synopsis : (meta.synopsis || (meta.fr&&meta.fr.synopsis) || 'Pas de synopsis disponible.');
  const title = (meta.fr && meta.fr.title && meta.fr.title!==meta.title) ? meta.fr.title : meta.title;
  const facts = [
    meta.format, meta.year, meta.state,
    meta.episodes ? meta.episodes+' épisodes' : null,
    meta.chapters ? meta.chapters+' chapitres' : null,
    meta.volumes ? meta.volumes+' tomes' : null,
    meta.studios && meta.studios.length ? meta.studios.join(', ') : null
  ].filter(Boolean).map(x=>h('span',{},String(x)));
  const scores = [];
  if(meta.scoreAL) scores.push('AniList '+(meta.scoreAL/10).toFixed(1)+'/10');
  if(meta.scoreMAL) scores.push('MyAnimeList '+meta.scoreMAL+'/10');
  if(meta.scoreTMDB) scores.push('TMDB '+meta.scoreTMDB+'/10');

  const refresh = () => { const sc = $('#veil'); const top = sc ? sc.scrollTop : 0; renderDetail(); const n = $('#veil'); if(n) n.scrollTop = top; };
  const mut = fn => { const en = ensure(meta); fn(en); touch(en); refresh(); };

  const prog = (max || !isFilm) ? h('div',{class:'row'}, h('label',{},isManga?'Lecture':'Progression'),
    h('div',{class:'prog'},
      h('button',{class:'btn ghost sm',onclick:()=>mut(en=>{ en.progress = Math.max(0,(en.progress||0)-1); })},'−'),
      h('input',{type:'number',min:0,max:max||undefined,value:e.progress||0,'aria-label':unit,onchange:ev=>mut(en=>{ en.progress = Math.max(0, parseInt(ev.target.value,10)||0); if(max) en.progress = Math.min(en.progress,max); if(!en.status && en.progress>0) en.status='current'; })}),
      h('button',{class:'btn ghost sm',onclick:()=>mut(en=>{ en.progress = Math.min(max||9999,(en.progress||0)+1); if(!en.status) en.status='current'; })},'+'),
      h('span',{class:'note'}, max ? 'sur '+max+' '+unit : unit))) : null;

  const lists = h('div',{class:'row'}, h('label',{},'Listes'),
    h('div',{class:'listrow'},
      DB.lists.map(l=>h('button',{class:'chip'+(l.keys.includes(meta.key)?' on':''),onclick:()=>{
        const en = ensure(meta);
        if(l.keys.includes(meta.key)) l.keys = l.keys.filter(k=>k!==meta.key); else l.keys.push(meta.key);
        touch(en); refresh();
      }},l.name)),
      h('button',{class:'chip',onclick:()=>{
        const n = (prompt('Nom de la nouvelle liste ?')||'').trim(); if(!n) return;
        const en = ensure(meta); DB.lists.push({ id:uid(), name:n, desc:'', keys:[meta.key] }); touch(en); refresh();
      }},'+ Nouvelle liste')));

  const sh = DB.shelf[meta.key];
  const shelfRow = isManga ? h('div',{class:'row'}, h('label',{},'Bibliothèque'),
    sh ? h('div',{class:'row'}, h('span',{class:'note'},'Dans ta bibliothèque : '+sh.own.length+' tome'+(sh.own.length>1?'s':'')+' possédé'+(sh.own.length>1?'s':'')),
        h('button',{class:'btn ghost sm',onclick:()=>{ S.shelf.open[meta.key] = true; closeDetail(); go('shelf'); }},'Gérer les tomes'))
       : h('button',{class:'btn ghost sm',onclick:()=>{ addShelf(meta); toast('Ajouté à ta bibliothèque'); refresh(); }},'Ajouter à ma bibliothèque')) : null;
  const veil = h('div',{id:'veil',class:'veil',onclick:ev=>{ if(ev.target.id==='veil') closeDetail(); }},
    h('div',{class:'sheet',role:'dialog','aria-modal':'true','aria-label':title},
      h('button',{class:'x','aria-label':'Fermer',onclick:closeDetail},'×'),
      h('div',{class:'ban',style:(meta.color?`--c:${meta.color};`:'')+(meta.banner?`background-image:url('${meta.banner.replace(/'/g,'%27')}')`:'')}),
      h('div',{class:'body'},
        Poster(meta),
        h('div',{},
          h('h2',{},title,Info('fiche')),
          meta.titleJp ? h('div',{class:'jp'},meta.titleJp) : null,
          h('div',{class:'facts'},facts),
          meta.genres && meta.genres.length ? h('div',{class:'genres'},meta.genres.map(g=>h('span',{},g))) : null,
          scores.length ? h('div',{class:'note',style:'margin-bottom:10px'},scores.join('   ')) : null,
          meta.fr && meta.fr.synopsis && meta.synopsis ? h('div',{class:'langs'},
            h('button',{class:'chip'+(CUR.lang==='fr'?' on':''),onclick:()=>{CUR.lang='fr';refresh();}},'Français'),
            h('button',{class:'chip'+(CUR.lang==='en'?' on':''),onclick:()=>{CUR.lang='en';refresh();}},'Version originale')) : null,
          h('div',{class:'syn'},syn),
          h('div',{class:'note',style:'margin-top:8px'},'Sources : '+(meta.src||[]).join(', '))),
        h('div',{class:'panel'},
          h('div',{class:'row'}, h('label',{},'Statut'),
            h('div',{class:'chips'}, STATUS(meta.type).map(([v,l])=>h('button',{class:'chip'+(e.status===v?' on':''),onclick:()=>mut(en=>{
              en.status = en.status===v ? null : v;
              if(v==='done' && en.status){ const m = isManga ? meta.chapters : meta.episodes; if(m) en.progress = m; if(!en.seen) en.seen = today(); }
            })},l)))),
          h('div',{class:'row'}, h('label',{},'Ta note'),
            Stars(e.rating||0, v=>mut(en=>{ en.rating = v; }), true),
            h('button',{class:'heartbtn'+(e.liked?' on':''),'aria-label':'Coup de cœur','aria-pressed':String(!!e.liked),onclick:()=>mut(en=>{ en.liked = !en.liked; })},'♥')),
          prog,
          h('div',{class:'row'}, h('label',{},isManga?'Lu le':'Vu le'),
            h('input',{type:'date',value:e.seen||'',onchange:ev=>{ const en = ensure(meta); en.seen = ev.target.value; touch(en); }}),
            h('input',{type:'text',placeholder:'Étiquettes : mécha, cosy, à revoir…',value:(e.tags||[]).join(', '),style:'flex:1 1 220px',onchange:ev=>{ const en = ensure(meta); en.tags = ev.target.value.split(',').map(s=>s.trim()).filter(Boolean); touch(en); }})),
          h('textarea',{placeholder:'Ta critique (visible seulement par toi)…',oninput:ev=>{ const en = ensure(meta); en.review = ev.target.value; en.upd = Date.now(); save(); },onblur:()=>{ const en=E(meta.key); if(en) { touch(en); } }},e.review||''),
          lists,
          shelfRow,
          h('div',{class:'row'},
            CUR.logged ? h('button',{class:'btn ghost',disabled:true,'aria-live':'polite'},isManga?'✓ Ajouté au journal de lecture':'✓ Ajouté au journal') : h('button',{class:'btn',onclick:()=>logDiary(meta)},isManga?'Ajouter au journal de lecture':'Ajouter au journal'),
            E(meta.key) && active(E(meta.key)) ? h('button',{class:'btn ghost',onclick:()=>{
              if(!confirm('Retirer cette œuvre de ta collection ? Ta note, ta critique et ses entrées du journal seront supprimées.')) return;
              delete DB.items[meta.key]; DB.diary = DB.diary.filter(d=>d.key!==meta.key); DB.lists.forEach(l=>{ l.keys = l.keys.filter(k=>k!==meta.key); }); save(); closeDetail(); toast('Retiré de ta collection');
            }},'Retirer de ma collection') : null)))));
  const old = $('#veil'); const top = old ? old.scrollTop : 0;
  if(old) old.remove();
  document.body.append(veil);
  veil.scrollTop = top;
}

function logDiary(meta){
  const e = ensure(meta);
  const date = e.seen || today();
  const rewatch = DB.diary.some(d=>d.key===meta.key);
  DB.diary.push({ id:uid(), key:meta.key, date, rating:e.rating||0, review:e.review||'', rewatch });
  e.seen = date; e.status = 'done';
  const m = meta.type==='manga' ? meta.chapters : (meta.type==='anime' ? meta.episodes : null);
  if(m) e.progress = m;
  touch(e);
  if(CUR) CUR.logged = true;
  renderDetail();
}

function renderHeader(){
  return h('div',{class:'topwrap'},
    h('div',{class:'top'},
      h('div',{class:'brand'}, h('div',{class:'hanko','aria-hidden':'true'},APP.kanji), h('div',{}, h('h1',{},APP.name), h('small',{},APP.tag))),
      h('button',{class:'menu-btn','aria-label':'Ouvrir le menu',title:'Menu',onclick:openDrawer}, h('i',{}), h('i',{}), h('i',{}))));
}

function render(){
  const app = $('#app'); app.replaceChildren(renderHeader(), h('main',{}, h('div',{id:'toolbar'}), h('div',{id:'content'})));
  renderToolbar(); renderContent();
}

function setSub(v){
  S.letter = ''; S.sub = v; S.results = []; S.src = {}; S.more = false;
  if(v==='explore' || v==='season'){ if(v==='season') S.q = ''; renderToolbar(); runSearch(false); }
  else { renderToolbar(); renderContent(); }
}
function letterStrip(re){
  const L = ['#',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
  return h('div',{class:'letters',role:'group','aria-label':'Filtrer par lettre'},
    h('button',{class:'lt'+(!S.letter?' on':''),'aria-pressed':String(!S.letter),onclick:()=>{ S.letter = ''; re(); }},'Tous'),
    L.map(x=>h('button',{class:'lt'+(S.letter===x?' on':''),'aria-pressed':String(S.letter===x),onclick:()=>{ S.letter = x; re(); }},x)));
}
function filterBar(kind){
  const re = () => { renderToolbar(); if(kind==='mine') renderContent(); else runSearch(false); };
  const box = h('div',{class:'fbar'}, h('div',{class:'frow'}, h('b',{style:'font-family:var(--serif);display:flex;align-items:center'},'Filtres',Info('filters'))));
  if(kind==='explore') box.append(h('div',{class:'chips'},[['POPULARITY_DESC','Les plus populaires'],['TRENDING_DESC','Tendances'],['SCORE_DESC','Mieux notés'],['ALPHA','A → Z']].map(([v,l])=>h('button',{class:'chip'+(S.sort===v?' on':''),'aria-pressed':String(S.sort===v),onclick:()=>{ S.sort = v; re(); }},l))));
  if(kind!=='mine'){
    const yrs = []; for(let y=new Date().getFullYear()+1; y>=1980; y--) yrs.push(y);
    box.append(h('div',{class:'frow'},
      h('select',{'aria-label':'Catégorie',value:S.genre,onchange:ev=>{ S.genre = ev.target.value; re(); }}, h('option',{value:''},'Toutes les catégories'), GENRES.map(([v,l])=>h('option',{value:v},l))),
      kind==='explore' ? h('select',{'aria-label':'Année',value:S.year?String(S.year):'',onchange:ev=>{ S.year = parseInt(ev.target.value,10)||0; re(); }}, h('option',{value:''},'Toutes les années'), yrs.map(y=>h('option',{value:String(y)},String(y)))) : null,
      (S.genre || S.year || S.letter) ? h('button',{class:'btn ghost sm',onclick:()=>{ S.genre = ''; S.year = 0; S.letter = ''; re(); }},'Réinitialiser') : null));
  }
  box.append(letterStrip(re));
  return box;
}
function renderToolbar(){
  const tb = $('#toolbar'); tb.replaceChildren();
  if(!TYPE[S.view]) return;
  const T = TYPE[S.view];
  tb.append(h('div',{class:'head'},
    h('div',{class:'vert','aria-hidden':'true'},T.kanji),
    h('div',{}, h('h2',{},T.label,Info(S.sub==='mine' ? 'mine' : S.sub==='season' ? 'season' : S.view)), h('p',{},T.desc)),
    h('div',{class:'tabs'},
      h('button',{class:S.sub==='explore'?'on':'',onclick:()=>setSub('explore')},'Explorer'),
      S.view==='anime' ? h('button',{class:S.sub==='season'?'on':'',onclick:()=>setSub('season')},'Saison') : null,
      h('button',{class:S.sub==='mine'?'on':'',onclick:()=>setSub('mine')},'Ma collection'))));
  if(S.sub==='explore'){
    const inp = h('input',{type:'search',id:'q',placeholder:S.view==='manga'?'Chercher un manga…':S.view==='film'?'Chercher un film d’animation…':'Chercher un animé…',value:S.q,'aria-label':'Recherche',
      oninput:ev=>{ S.q = ev.target.value; clearTimeout(debounce); debounce = setTimeout(()=>runSearch(false),500); },
      onkeydown:ev=>{ if(ev.key==='Enter'){ clearTimeout(debounce); runSearch(false); } }});
    tb.append(h('div',{class:'search'}, inp, h('button',{class:'btn',onclick:()=>{ clearTimeout(debounce); runSearch(false); }},'Chercher')));
    tb.append(filterBar('explore'));
    tb.append(h('div',{class:'sources',id:'srcs'}));
  } else if(S.sub==='season'){
    const re = () => { S.results = []; S.src = {}; renderToolbar(); runSearch(false); };
    tb.append(h('div',{class:'wk'},
      h('button',{class:'btn ghost sm',onclick:()=>{ shiftSeason(-1); re(); }},'‹ Précédente'),
      h('span',{class:'label'},SEASON_FR[S.season.s]+' '+S.season.y),
      h('button',{class:'btn ghost sm',onclick:()=>{ shiftSeason(1); re(); }},'Suivante ›'),
      h('button',{class:'btn ghost sm',onclick:()=>{ S.season = curSeason(); re(); }},'Saison actuelle')));
    tb.append(filterBar('season'));
    tb.append(h('div',{class:'sources',id:'srcs'}));
  } else {
    tb.append(h('div',{class:'filters'},
      h('div',{class:'chips'}, [['all','Tout'],...STATUS(S.view),['liked','Coups de cœur']].map(([v,l])=>h('button',{class:'chip'+(S.filter.status===v?' on':''),onclick:()=>{ S.filter.status=v; renderToolbar(); renderContent(); }},l))),
      h('select',{'aria-label':'Tri',value:S.filter.sort,onchange:ev=>{ S.filter.sort=ev.target.value; renderContent(); }},
        h('option',{value:'recent'},'Ajoutés récemment'), h('option',{value:'rating'},'Meilleures notes'), h('option',{value:'title'},'Titre A-Z'), h('option',{value:'year'},'Année')),
      h('input',{type:'search',placeholder:'Filtrer…',value:S.filter.text,'aria-label':'Filtrer',oninput:ev=>{ S.filter.text=ev.target.value; renderContent(); }})));
    tb.append(filterBar('mine'));
  }
}

function renderContent(){
  const c = $('#content'); if(!c) return;
  c.replaceChildren();
  const v = S.view;
  if(TYPE[v]){
    if(S.sub!=='mine'){
      const s = $('#srcs');
      if(s){ s.replaceChildren(); const names = Object.keys(S.src);
        names.forEach(n=>s.append(h('span',{class:S.src[n]},n+(S.src[n]==='ok'?' · connecté':' · injoignable'))));
        if(S.loading) s.append(h('span',{},h('i',{class:'spin'}),'Recherche en cours…')); }
      if(S.loading && !S.results.length) return;
      if(!S.results.length){
        const failed = S.src.AniList==='ko';
        c.append(Empty('空', failed ? 'Connexion impossible' : 'Aucun résultat',
          failed ? 'Les sites de données sont inaccessibles. Si tu vois cette page dans l’aperçu de Claude, télécharge le fichier et ouvre-le dans ton navigateur (Chrome, Safari, Firefox) : la recherche y fonctionne. Ta collection reste disponible hors ligne.' : 'Essaie un autre titre, en romaji ou en anglais.',
          failed ? h('button',{class:'btn',onclick:()=>{ S.sub='mine'; renderToolbar(); renderContent(); }},'Ouvrir ma collection') : null));
        return;
      }
      if(S.sub==='season') c.append(h('h3',{style:'margin:0 0 14px;font-size:19px'},'Les plus populaires : '+SEASON_FR[S.season.s]+' '+S.season.y));
      const vis = visibleResults();
      if(!vis.length){
        c.append(Empty('空','Aucun résultat pour ces filtres', S.more ? 'Rien dans ce lot. Charge la suite pour continuer à chercher.' : 'Essaie une autre lettre, une autre catégorie ou une autre année.',
          S.more ? h('button',{class:'btn',onclick:()=>runSearch(true)},'Charger la suite') : null));
        return;
      }
      if(S.letter) c.append(h('p',{class:'note',style:'margin:0 0 12px'},'Parmi les œuvres chargées, celles qui commencent par '+(S.letter==='#'?'un chiffre ou un symbole':S.letter)+'.'));
      c.append(h('div',{class:'grid'},vis.map(Card)));
      if(S.more) c.append(h('button',{class:'btn ghost more',onclick:()=>runSearch(true)},'Voir plus de résultats'));
    } else {
      let list = Object.values(DB.items).filter(e=>active(e) && e.meta.type===v);
      const f = S.filter;
      if(f.status==='liked') list = list.filter(e=>e.liked); else if(f.status!=='all') list = list.filter(e=>e.status===f.status);
      if(f.text.trim()){ const t = norm(f.text); list = list.filter(e=>[e.meta.title,e.meta.titleRo,e.meta.titleJp,(e.tags||[]).join(' ')].some(x=>norm(x).includes(t))); }
      const sorters = { recent:(a,b)=>b.upd-a.upd, rating:(a,b)=>b.rating-a.rating||b.upd-a.upd, title:(a,b)=>a.meta.title.localeCompare(b.meta.title,'fr'), year:(a,b)=>(b.meta.year||0)-(a.meta.year||0) };
      if(S.letter) list = list.filter(e=>matchLetter(e.meta,S.letter));
      list.sort(sorters[f.sort]);
      if(!list.length){
        c.append(Empty('空', 'Rien ici pour l’instant', v==='manga' ? 'Cherche un manga, puis note-le ou range-le sur ton étagère.' : 'Cherche une œuvre dans Explorer, puis note-la ou ajoute-la à ta liste.',
          h('button',{class:'btn',onclick:()=>{ S.sub='explore'; renderToolbar(); renderContent(); }},'Explorer '+TYPE[v].label.toLowerCase())));
        return;
      }
      c.append(h('div',{class:'grid'},list.map(e=>Card(e.meta))));
    }
    return;
  }
  if(v==='shelf') return viewShelf(c);

/* ═════════ Bibliothèque de mangas (tome par tome) ═════════ */
function addShelf(meta){
  if(DB.shelf[meta.key]) return;
  DB.shelf[meta.key] = { meta, total:meta.volumes||0, own:[], read:[], added:Date.now() };
  save();
}
function cycleTome(sh,n){
  if(!sh.own.includes(n)) sh.own.push(n);
  else if(!sh.read.includes(n)) sh.read.push(n);
  else { sh.own = sh.own.filter(x=>x!==n); sh.read = sh.read.filter(x=>x!==n); }
  save();
}
async function shelfSearch(){
  const sh = S.shelf, my = ++sh.tok, q = sh.q.trim();
  sh.err = false;
  if(!q){ sh.res = []; sh.loading = false; renderShelfRes(); return; }
  sh.loading = true; renderShelfRes();
  try{ const r = await anilist('manga',q,1); if(my!==sh.tok) return; sh.res = r.list; }
  catch(e){ if(my!==sh.tok) return; sh.res = []; sh.err = true; }
  sh.loading = false; renderShelfRes();
}
function renderShelfRes(){
  const d = $('#shres'); if(!d) return; d.replaceChildren();
  const sh = S.shelf;
  if(sh.loading){ d.append(h('p',{class:'note'},h('i',{class:'spin'}),'Recherche…')); return; }
  if(sh.err){ d.append(h('p',{class:'note'},'Recherche impossible : vérifie ta connexion et réessaie.')); return; }
  if(!sh.q.trim()) return;
  if(!sh.res.length){ d.append(h('p',{class:'note'},'Aucun manga trouvé. Essaie le titre en romaji ou en anglais.')); return; }
  sh.res.slice(0,8).forEach(m=>{
    const have = !!DB.shelf[m.key];
    d.append(h('div',{class:'srow'},
      h('button',{class:'card','aria-label':m.title,onclick:()=>openDetail(m)},Poster(m)),
      h('div',{}, h('div',{style:'font-family:var(--serif)'},m.title), h('small',{class:'note'},[m.year, m.volumes ? m.volumes+' tomes' : 'nombre de tomes inconnu'].filter(Boolean).join('   '))),
      have ? h('span',{class:'pill'},'Ajouté') : h('button',{class:'btn sm',onclick:()=>{ addShelf(m); S.shelf.open[m.key] = true; S.shelf.q = ''; S.shelf.res = []; toast('Ajouté à ta bibliothèque'); renderContent(); }},'Ajouter')));
  });
}
function ShelfPanel(sh){
  const m = sh.meta, k = m.key, open = !!S.shelf.open[k];
  const total = Math.max(sh.total||0, ...sh.own, ...sh.read, 0);
  const pct = n => total ? Math.round(n/total*100) : 0;
  const upd = () => { save(); renderContent(); };
  const head = h('button',{class:'sh-h','aria-expanded':String(open),onclick:()=>{ S.shelf.open[k] = !open; renderContent(); }},
    Poster(m),
    h('div',{}, h('h3',{},m.title),
      h('small',{},sh.own.length+(total?' sur '+total:'')+' tome'+(sh.own.length>1?'s':'')+' possédé'+(sh.own.length>1?'s':'')+'   '+sh.read.length+' lu'+(sh.read.length>1?'s':'')),
      h('div',{class:'pbar'},h('i',{class:'o',style:`width:${pct(sh.own.length)}%`}),h('i',{class:'r',style:`width:${pct(sh.read.length)}%`}))));
  const panel = h('div',{class:'sh'},head);
  if(open){
    const tomes = [];

  if(cur) lines.push(cur);

  return lines.map(l=>{ if(g.measureText(l).width<=maxW) return l; let x = l.replace(/…$/,''); while(x.length>1 && g.measureText(x+'…').width>maxW) x = x.slice(0,-1); return x+'…'; });

  sk.forEach(k=>{ const x = (a.shelf||{})[k], y = (b.shelf||{})[k];
    if(!x || !y){ out.shelf[k] = x || y; return; }
    out.shelf[k] = Object.assign({}, x, { total:Math.max(x.total||0,y.total||0), own:[...new Set([...x.own,...y.own])].sort((p,q)=>p-q), read:[...new Set([...x.read,...y.read])].sort((p,q)=>p-q), added:Math.min(x.added||Date.now(),y.added||Date.now()) }); });
  const pa = a.profile || {}, pb = b.profile || {};
  out.profile = Object.assign(defaults().profile, (!pa.name && pb.name) ? pb : (!pb.name ? pa : ((a.updatedAt||0) >= (b.updatedAt||0) ? pa : pb)));
  out.settings = Object.assign({}, b.settings, a.settings, { tmdb:(a.settings||{}).tmdb || '' });
  out.updatedAt = Date.now();
  return out;
}

function scheduleSync(){ if(!CS.session || !cloudReady()) return; clearTimeout(CS.timer); CS.timer = setTimeout(()=>cloudSync(),2500); }
async function cloudSync(){
  if(!CS.session || CS.syncing || !cloudReady()) return;
  CS.syncing = true; setStatus('syncing');
  try{
    const token = await getToken(); if(!token) throw new Error('Session expirée');
    const uid = CS.session.user.id;
    const rows = await sb(`/rest/v1/kizuna_data?user_id=eq.${encodeURIComponent(uid)}&select=data,updated_at`,{ token });
    const remote = rows && rows[0], last = +localStorage.getItem(SYNC_KEY) || 0;
    let changed = false;
    if(remote && (Date.parse(remote.updated_at)||0) > last){ DB = mergeData(DB, remote.data||{}); saveLocal(); changed = true; }
    const stamp = new Date().toISOString();
    await sb('/rest/v1/kizuna_data?on_conflict=user_id',{ method:'POST', token, prefer:'resolution=merge-duplicates,return=minimal', body:{ user_id:uid, data:exportable(), updated_at:stamp } });
    localStorage.setItem(SYNC_KEY,String(Date.parse(stamp))); localStorage.setItem('kizuna.lastsyncAt',String(Date.now()));
    CS.syncing = false; setStatus('ok');
    if(changed){ applyTheme(); render(); }
  }catch(e){ CS.syncing = false; if(CS.session) setStatus('error',frErr(e)); }
}
async function signOut(){
  try{ const t = CS.session && CS.session.access_token; if(t) await sb('/auth/v1/logout',{ method:'POST', token:t }); }catch(e){}
  setSession(null); localStorage.removeItem(SYNC_KEY); localStorage.removeItem('kizuna.lastsyncAt'); CS.status = 'idle'; CS.msg = '';
  if(confirm('Tu es déconnecté.\n\nOK : effacer aussi la collection enregistrée sur cet appareil (elle reste dans ton compte).\nAnnuler : la garder sur cet appareil.')){ DB = defaults(); saveLocal(); applyTheme(); }

}

async function authTest(){

async function submitAuth(){
  const up = AU.mode==='up';
  const email = $('#au-email').value.trim(), pw = $('#au-pw').value, pw2 = up ? $('#au-pw2').value : '';
  AU.email = email; AU.cgu = !!($('#au-cgu') && $('#au-cgu').checked); AU.age = !!($('#au-age') && $('#au-age').checked);
  const bad = t => { AU.msg = { t:'err', text:t }; renderAuth(); };
  if(!email || !pw) return bad('Renseigne ton email et ton mot de passe.');
  if(up && pw.length < 8) return bad('Choisis un mot de passe d’au moins 8 caractères.');
  if(up && pw!==pw2) return bad('Les deux mots de passe ne correspondent pas.');
  if(up && !AU.cgu) return bad('Tu dois accepter les conditions d’utilisation et la politique de confidentialité.');
  if(up && !AU.age) return bad('Tu dois confirmer avoir 15 ans ou plus, ou l’accord de ton représentant légal.');
  AU.busy = true; AU.msg = null; renderAuth();
  try{
    if(up){
      const j = await sb('/auth/v1/signup',{ method:'POST', body:{ email, password:pw, data:{ cgu_version:LEGAL.version, accepted_at:new Date().toISOString(), age_15_confirmed:true } } });
      if(!(j && j.access_token)){ AU.busy = false; AU.mode = 'in'; AU.msg = { t:'ok', text:'Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse, puis connecte-toi.' }; return renderAuth(); }
      setSession(toSession(j));
    } else {
      const j = await sb('/auth/v1/token?grant_type=password',{ method:'POST', body:{ email, password:pw } });
      setSession(toSession(j));
    }
    AU.busy = false; closeAuth(); closeWelcome(); toast(up ? 'Compte créé, bienvenue !' : 'Connecté'); refreshAccountViews(); await cloudSync();
  }catch(e){ AU.busy = false; AU.msg = { t:'err', text:frErr(e) }; renderAuth(); }
}
async function authRecover(){
  const el = $('#au-email'), email = ((el && el.value) || AU.email || '').trim(); AU.email = email;
  if(!email){ AU.msg = { t:'err', text:'Entre d’abord ton adresse email.' }; return renderAuth(); }

  catch(e){ AU.msg = { t:'err', text:frErr(e) }; }

async function submitNewPassword(){
  const pw = $('#au-pw').value, pw2 = $('#au-pw2').value;
  const bad = t => { AU.msg = { t:'err', text:t }; renderAuth(); };
  if(pw.length < 8) return bad('Choisis un mot de passe d’au moins 8 caractères.');
  if(pw!==pw2) return bad('Les deux mots de passe ne correspondent pas.');
  AU.busy = true; AU.msg = null; renderAuth();
  try{ const token = await getToken(); await sb('/auth/v1/user',{ method:'PUT', token, body:{ password:pw } }); AU.busy = false; closeAuth(); toast('Mot de passe mis à jour'); refreshAccountViews(); cloudSync(); }
  catch(e){ AU.busy = false; AU.msg = { t:'err', text:frErr(e) }; renderAuth(); }
}
async function handleAuthHash(){
  const raw = location.hash.replace(/^#/,''); if(!raw) return;
  const p = new URLSearchParams(raw);
  if(p.get('error_description')){ history.replaceState(null,'',location.pathname+location.search); toast('Lien invalide ou expiré. Recommence la demande.'); return; }
  const at = p.get('access_token'); if(!at || !cloudReady()) return;
  history.replaceState(null,'',location.pathname+location.search);
  try{
    const u = await sb('/auth/v1/user',{ token:at });
    setSession({ access_token:at, refresh_token:p.get('refresh_token'), expires_at:Math.floor(Date.now()/1000) + (+p.get('expires_in') || 3600), user:{ id:u.id, email:u.email } });
    if(p.get('type')==='recovery'){ AU.mode = 'recover-set'; AU.msg = null; renderAuth(); document.body.style.overflow = 'hidden'; }
    else { closeWelcome(); toast('Email confirmé, tu es connecté'); refreshAccountViews(); cloudSync(); }
  }catch(e){ toast(frErr(e)); }
}

function Info(key, abs){

function openLegal(name){
  if(!LEGAL_TITLES[name]) return;
  const old = $('#veil5'); if(old) old.remove();
  const v = h('div',{id:'veil5',class:'veil',onclick:ev=>{ if(ev.target.id==='veil5') closeLegal(); }},
    h('div',{class:'sheet t10 legal',role:'dialog','aria-modal':'true','aria-label':LEGAL_TITLES[name],style:'max-width:760px'},
      h('button',{class:'x','aria-label':'Fermer',onclick:closeLegal},'×'),
      h('h2',{},LEGAL_TITLES[name]),
      h('p',{class:'upd'},'Version '+LEGAL.version+' · mise à jour le '+LEGAL.date),
      legalDoc(name),
      h('div',{class:'row2',style:'margin-top:22px'},
        ['mentions-legales','confidentialite','cgu','credits'].filter(n=>n!==name).map(n=>h('button',{class:'btn ghost sm',onclick:()=>openLegal(n)},LEGAL_TITLES[n].split(' et ')[0])))));
  document.body.append(v); document.body.style.overflow = 'hidden';
  try{ history.replaceState(null,'','#'+name); }catch(e){}
}
function closeLegal(){
  const v = $('#veil5'); if(v) v.remove();
  document.body.style.overflow = ($('#veil4') || CUR) ? 'hidden' : '';
  try{ if(LEGAL_TITLES[location.hash.slice(1)]) history.replaceState(null,'',location.pathname+location.search); }catch(e){}
}
function handleLegalHash(){ const n = location.hash.slice(1); if(LEGAL_TITLES[n]) openLegal(n); }
function renderLegalLinks(){
  const box = document.getElementById('legal-links'); if(!box) return; box.replaceChildren();
  [['mentions-legales','Mentions légales'],['confidentialite','Confidentialité'],['cgu','Conditions d’utilisation'],['credits','Crédits']].forEach(([n,l])=>box.append(h('button',{class:'linkbtn',onclick:()=>openLegal(n)},l)));
}

document.getElementById('ver').textContent = APP.version;
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'){ if($('#veil6')) closeInfo(); else if($('#veil5')) closeLegal(); else if($('#veil4')) closeAuth(); else if($('#dw')) closeDrawer(); else if($('#veil3')) closeFavs(); else if($('#veil2')) closeTop10(); else if(CUR) closeDetail(); } });
render();
renderLegalLinks();
if(!CS.session && !localStorage.getItem(WELCOME_KEY) && !LEGAL_TITLES[location.hash.slice(1)] && !/access_token|error_description/.test(location.hash)) showWelcome();
handleLegalHash();
window.addEventListener('hashchange',handleLegalHash);
handleAuthHash();
if(CS.session && cloudReady()) cloudSync();
window.addEventListener('online',()=>{ if(CS.session) cloudSync(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && CS.session && Date.now() - (+localStorage.getItem('kizuna.lastsyncAt')||0) > 60000) cloudSync(); });
</script>
